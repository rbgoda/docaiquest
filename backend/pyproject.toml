[project]
name = "docaiquest-backend"
version = "0.1.0"
description = "DocAIQuest API — FastAPI backend serving the audit platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pyjwt[crypto]>=2.9",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "boto3>=1.35",
    "python-multipart>=0.0.9",
    "arq>=0.26",
    "redis>=5.0",
    "pymupdf>=1.24",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
