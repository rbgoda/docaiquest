<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin — DocAIQuest</title>
<style>
  :root{
    --bg:#15130f; --surface:#1d1a14; --panel:#232019; --line:#34302651; --line2:#3a352a;
    --ink:#efe9dd; --ink2:#c9c1ad; --ink3:#8f8771; --gold:#C8A04C; --gold2:#E2BC68;
    --emerald:#3FA47A; --amber:#E0A23B; --rose:#D8625E; --violet:#8B7FD6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased}
  .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
  a{color:var(--gold2)}
  /* layout */
  header.bar{display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--bg);z-index:5}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600}
  .dot{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--gold2),var(--gold))}
  .sub{color:var(--ink3);font-size:12px;font-weight:400}
  main{max-width:1080px;margin:0 auto;padding:24px 24px 88px}
  /* login */
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:34px;width:100%;max-width:400px}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:600;margin:0 0 4px}
  label{display:block;font-size:12px;color:var(--ink3);margin:14px 0 5px}
  input,select{width:100%;padding:9px 11px;background:var(--panel);border:1px solid var(--line2);
    border-radius:9px;color:var(--ink);font-size:14px}
  select{cursor:pointer;width:auto}
  button{font-family:inherit}
  .btn{background:var(--gold2);color:#1a1408;border:none;border-radius:999px;
    padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:none;color:var(--ink2);border:1px solid var(--line2)}
  .btn.sm{padding:5px 11px;font-size:12px}
  .err{color:var(--rose);font-size:13px;margin-top:10px;min-height:18px}
  /* kpis */
  .kpis{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 18px}
  .kpi{border:1px solid var(--line2);border-radius:11px;padding:10px 16px;min-width:92px}
  .kpi .n{font-size:22px}
  .kpi .l{font-size:11px;color:var(--ink3);text-transform:capitalize}
  /* table */
  .wrap{border:1px solid var(--line2);border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:9px 12px;font-size:11px;color:var(--ink3);font-weight:600;
    text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line2);background:var(--panel)}
  td{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .tag{font-size:11px;border-radius:999px;padding:2px 9px;border:1px solid currentColor;white-space:nowrap}
  .right{text-align:right}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .toolbar input{max-width:280px}
  .muted{color:var(--ink3)}
  .grow{flex:1}
  .panel{border:1px solid var(--line2);border-radius:12px;padding:14px 16px}
  .ph{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
  .hrow{display:flex;align-items:center;padding:6px 0;font-size:13px}
  .hk{color:var(--ink2)} .hv{margin-left:auto;color:var(--ink)}
  /* flex helpers used throughout the console (were referenced but never defined,
     so rows/space-between layouts silently didn't apply — feedback #29/#32) */
  .row{display:flex;align-items:center} .between{justify-content:space-between}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="muted mono">Loading…</div></div></div>

<script>
const PLANS = ["trial","free","pro","enterprise"];
const TONE = {trial:"var(--gold2)",free:"var(--ink3)",pro:"var(--emerald)",enterprise:"var(--violet)"};
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
const esc = (s)=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, opts={}){
  const r = await fetch("/api"+path, {credentials:"include",
    headers:{"Content-Type":"application/json"}, ...opts});
  if(r.status===401){ throw {code:401}; }
  let body=null; try{ body=await r.json(); }catch(e){}
  if(!r.ok){ throw {code:r.status, detail:(body&&body.detail)||r.statusText}; }
  return body;
}

const app = document.getElementById("app");

function renderLogin(msg){
  app.innerHTML="";
  const err = $('<div class="err"></div>'); if(msg) err.textContent=msg;
  const email=$('<input type="email" autocomplete="username" placeholder="you@example.com">');
  const pass=$('<input type="password" autocomplete="current-password" placeholder="••••••••">');
  const btn=$('<button class="btn" style="margin-top:18px;width:100%">Sign in</button>');
  const card=$('<div class="card"></div>');
  card.appendChild($('<h1>Admin</h1>'));
  card.appendChild($('<div class="sub" style="margin-bottom:12px">DocAIQuest · superadmin console</div>'));
  // Google sign-in — routed through the MAIN app domain (its OAuth callback is whitelisted), which
  // shares the session across *.docaiq.jicama.tech and returns here via next=.
  const gbtn=$('<button class="btn" style="width:100%;background:#fff;color:#1f2430;display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid #dadce0"><svg width="17" height="17" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.5 13.3l7.9 6.1C12.3 13.2 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.3-4.6 7l7.1 5.5c4.1-3.8 6.5-9.4 6.5-16z"/><path fill="#FBBC05" d="M10.4 28.4c-.5-1.5-.8-3-.8-4.4s.3-3 .8-4.4l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.6l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.3-4.5 2.1-8.8 2.1-6.4 0-11.7-3.7-13.6-8.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg> Sign in with Google</button>');
  gbtn.onclick=()=>{ const main=location.hostname.replace(/^admin\./,''); const back=encodeURIComponent(location.origin+'/'); location.href=location.protocol+'//'+main+'/api/auth/google/login?next='+back; };
  card.appendChild(gbtn);
  card.appendChild($('<div class="sub" style="text-align:center;margin:12px 0;opacity:.55;font-size:11px">— or sign in with email —</div>'));
  const lblE=$('<label>Email</label>'); const lblP=$('<label>Password</label>');
  card.append(lblE,email,lblP,pass,btn,err);
  const go=async()=>{
    btn.disabled=true; err.textContent="";
    try{
      await api("/auth/login",{method:"POST",body:JSON.stringify({email:email.value.trim(),password:pass.value})});
      boot();
    }catch(e){ err.textContent = e.code===401?"Invalid email or password.":("Login failed: "+(e.detail||e.code)); btn.disabled=false; }
  };
  btn.onclick=go; pass.onkeydown=(e)=>{if(e.key==="Enter")go();};
  const wrap=$('<div class="center"></div>'); wrap.appendChild(card); app.appendChild(wrap);
  email.focus();
}

function renderDenied(me){
  app.innerHTML="";
  const card=$('<div class="card"></div>');
  card.innerHTML='<h1>Not authorized</h1><div class="sub">'+esc(me.email)+
    ' is not an admin yet. Ask an existing admin to add your email in the console\'s <b>Admins</b> tab.</div>';
  const out=$('<button class="btn ghost" style="margin-top:18px">Sign out</button>');
  out.onclick=async()=>{ try{await api("/auth/logout",{method:"POST"});}catch(e){} renderLogin(); };
  card.appendChild(out);
  const wrap=$('<div class="center"></div>'); wrap.appendChild(card); app.appendChild(wrap);
}

let STATE={users:[],counts:{},q:"",view:"overview",feedback:[],fcounts:{},plans:[],overview:null,llm:[],fleet:null,schemas:[]};

async function loadUsers(){
  const [d,a,p,u]=await Promise.all([
    api("/superadmin/users"),
    api("/superadmin/activity").catch(()=>null),
    api("/superadmin/promo-codes").catch(()=>({codes:[]})),
    api("/superadmin/llm-usage?bucket="+(STATE.llmBucket||"day")+"&scope="+(STATE.llmScope||"tenant")).catch(()=>null),
  ]);
  STATE.users=d.users||[]; STATE.counts=d.counts||{}; STATE.activity=a; STATE.promos=(p&&p.codes)||[]; STATE.llmUsage=u;
  paintConsole();
}

function paintConsole(){
  const counts=STATE.counts;
  const rows=STATE.users.filter(u=>{
    const q=STATE.q.trim().toLowerCase();
    return !q || ((u.email+" "+(u.name||"")).toLowerCase().includes(q));
  });
  const kpi=(k)=>`<div class="kpi"><div class="n mono">${counts[k]??0}</div><div class="l">${k}</div></div>`;
  const tag=(p)=>`<span class="tag" style="color:${TONE[p]||'var(--ink3)'}">${esc(p)}</span>`;
  const A=STATE.activity;
  const akpi=(n,l)=>`<div class="kpi"><div class="n mono">${n}</div><div class="l">${l}</div></div>`;
  const activityStrip = A ? `
    <div class="kpis">
      ${akpi(A.registered,"registered")}
      ${akpi(A.newLast7d,"new · 7d")}
      ${akpi(A.usersWithDocs,"activated")}
      ${akpi(A.activationPct+"%","activation")}
      ${akpi(A.activeLast30d,"active · 30d")}
      ${akpi(A.totalDocs,"documents")}
      ${akpi(A.totalQuestions,"questions")}
    </div>
    <div class="muted" style="font-size:11px;margin:-6px 0 12px">
      signups (14d): ${(A.signupsByDay||[]).map(s=>esc(s.day.slice(5))+"·"+s.n).join("   ")||"—"}
    </div>` : "";
  const body = rows.map(u=>`
    <tr data-pk="${u.pk}">
      <td><div style="font-weight:600">${esc(u.email)}</div>${u.name?'<div class="muted" style="font-size:11px">'+esc(u.name)+'</div>':''}</td>
      <td>${tag(u.plan)}</td>
      <td>${tag(u.effectivePlan)}</td>
      <td class="right mono" style="color:${u.trialDaysLeft===0?'var(--rose)':'var(--ink2)'}">${u.trialDaysLeft==null?'—':u.trialDaysLeft+'d'}</td>
      <td class="right mono">${u.docs}</td>
      <td class="right mono">${u.aiThisMonth}</td>
      <td class="right muted" style="font-size:11px">${u.lastUpload?esc(u.lastUpload.slice(0,10)):'—'}</td>
      <td>
        <select class="setplan">${PLANS.map(p=>`<option value="${p}"${p===u.plan?' selected':''}>${p}</option>`).join("")}</select>
      </td>
      <td style="white-space:nowrap"><button class="btn ghost sm shorten" title="Remove 7 days of trial">−7d</button> <button class="btn ghost sm extend" title="Add 7 days of trial">+7d</button></td>
    </tr>`).join("");

  const promos=STATE.promos||[];
  const promoRows=promos.map(pc=>`
    <tr data-promo="${pc.pk}">
      <td class="mono" style="font-weight:600">${esc(pc.code)}</td>
      <td>${tag(pc.plan)}</td>
      <td class="right mono">${pc.durationDays}d</td>
      <td class="right mono">${pc.redemptions}${pc.maxRedemptions!=null?'/'+pc.maxRedemptions:''}</td>
      <td>${pc.active?'<span class="tag" style="color:#46d29a">active</span>':'<span class="tag" style="color:var(--ink3)">off</span>'}</td>
      <td class="muted" style="font-size:11px">${pc.note?esc(pc.note):''}</td>
      <td><button class="btn sm togglepromo" style="background:${pc.active?'#e0a53c':'#46d29a'};color:#1a1710;font-weight:700">${pc.active?'Disable':'Enable'}</button></td>
    </tr>`).join("");
  const promoSection=`
    <div style="margin-top:26px" class="panel">
      <div style="font-weight:600;margin-bottom:4px">Promo codes</div>
      <div class="muted" style="font-size:11px;margin-bottom:12px">Share a code; a user redeems it under Account → Redeem code to get the plan for the duration.</div>
      <div class="toolbar" style="flex-wrap:wrap;gap:8px">
        <input class="pcode" placeholder="CODE (e.g. LAUNCH90)" style="max-width:180px;text-transform:uppercase">
        <select class="pplan" style="max-width:130px"><option value="pro">pro</option><option value="enterprise">enterprise</option></select>
        <select class="pdays" style="max-width:120px"><option value="90">90 days</option><option value="180">180 days</option><option value="365">365 days</option></select>
        <input class="pmax" type="number" min="1" placeholder="max uses (∞)" style="max-width:130px">
        <input class="pnote" placeholder="note (optional)" style="max-width:200px">
        <button class="btn sm createpromo">Create code</button>
      </div>
      <div class="err" id="perr"></div>
      <div class="wrap"><table>
        <thead><tr><th>Code</th><th>Plan</th><th class="right">Duration</th><th class="right">Uses</th><th>Status</th><th>Note</th><th></th></tr></thead>
        <tbody>${promoRows||'<tr><td colspan="7" class="muted" style="text-align:center;padding:16px">No promo codes yet — create one above.</td></tr>'}</tbody>
      </table></div>
    </div>`;

  // ---- Model utilization (reads the bounded rollup: 30d daily + monthly all-time) ----
  const usage=STATE.llmUsage; const ub=STATE.llmBucket||"day"; const usc=STATE.llmScope||"tenant";
  const fmtTok=n=>n==null?'0':n>=1000?(n/1000).toFixed(n>=100000?0:1)+'k':String(n);
  const uBk=(usage&&usage.buckets)||[];
  const labelHdr=usc==="user"?"User":"Model";
  const uRows=((usage&&usage.rows)||[]).map(m=>`
    <tr>
      <td class="mono" style="font-weight:600">${esc(m.label)}</td>
      <td class="muted" style="font-size:11px">${esc(m.provider||'—')}</td>
      ${uBk.map(b=>`<td class="right mono" style="font-size:11px">${(m.series[b]&&m.series[b].calls)||'·'}</td>`).join("")}
      <td class="right mono" style="font-weight:600">${m.calls}</td>
      <td class="right mono muted" style="font-size:11px">${fmtTok(m.inTok)}</td>
      <td class="right mono muted" style="font-size:11px">${fmtTok(m.outTok)}</td>
    </tr>`).join("");
  const usageSection=`
    <div style="margin-top:26px" class="panel">
      <div class="row between" style="align-items:center;margin-bottom:4px;flex-wrap:wrap;gap:8px">
        <div style="font-weight:600;flex-basis:100%;margin-bottom:8px">Model utilization</div>
        <div class="toolbar" style="gap:4px;flex-wrap:wrap;margin-bottom:0">
          ${[["tenant","By model"],["user","By user"]].map(([v,l])=>`<button class="btn sm uscope${v===usc?'':' ghost'}" data-scope="${v}">${l}</button>`).join("")}
          <span style="width:1px;height:16px;background:var(--line,#333);margin:0 4px"></span>
          ${[["day","30 days"],["month","Monthly"]].map(([v,l])=>`<button class="btn sm ubtn${v===ub?'':' ghost'}" data-bucket="${v}">${l}</button>`).join("")}
          <button class="btn sm ghost urefresh" title="Rebuild the rollup now">↻</button>
        </div>
      </div>
      <div class="muted" style="font-size:11px;margin-bottom:10px">All users combined${usc==="user"?" → broken out per user":""} · calls per ${ub} · In/Out = total tokens · ${ub==='day'?'last 30 days':'one entry per month (all-time)'}. Rollup refreshes hourly.</div>
      <div class="wrap" style="overflow-x:auto"><table style="white-space:nowrap;min-width:max-content">
        <thead><tr><th>${labelHdr}</th><th>Provider</th>${uBk.map(b=>`<th class="right" style="font-size:10px">${ub==='month'?b.slice(0,7):b.slice(5)}</th>`).join("")}<th class="right">Calls</th><th class="right">In</th><th class="right">Out</th></tr></thead>
        <tbody>${uRows||`<tr><td colspan="${uBk.length+5}" class="muted" style="text-align:center;padding:16px">No usage yet — hit ↻ to build the rollup.</td></tr>`}</tbody>
      </table></div>
    </div>`;

  const main=$('<main></main>');
  main.innerHTML=`
    ${activityStrip}
    <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Users by plan</div>
    <div class="kpis">${["total","trial","free","pro","enterprise"].map(kpi).join("")}</div>
    <div class="toolbar">
      <input class="filter grow" placeholder="Filter by email or name…" value="${esc(STATE.q)}" style="max-width:320px">
      <button class="btn ghost sm refresh">Refresh</button>
    </div>
    <div class="err" id="cerr"></div>
    <div class="wrap"><table>
      <thead><tr><th>User</th><th>Plan</th><th>Effective</th><th class="right">Trial</th>
        <th class="right">Docs</th><th class="right">AI/mo</th><th class="right">Last active</th><th>Set plan</th><th></th></tr></thead>
      <tbody>${body||'<tr><td colspan="9" class="muted" style="text-align:center;padding:20px">No users match.</td></tr>'}</tbody>
    </table></div>
    ${promoSection}
    ${usageSection}`;
  app.querySelector("main")?.remove();
  app.appendChild(main);

  const filter=main.querySelector(".filter");
  filter.oninput=()=>{STATE.q=filter.value; const pos=filter.selectionStart; paintConsole();
    const f=app.querySelector(".filter"); f.focus(); f.setSelectionRange(pos,pos);};
  main.querySelector(".refresh").onclick=()=>loadUsers().then(()=>showOk("Users refreshed")).catch(showErr);
  main.querySelectorAll("tr[data-pk]").forEach(tr=>{
    const pk=tr.getAttribute("data-pk");
    tr.querySelector(".setplan").onchange=async(e)=>{
      const plan=e.target.value;
      if(!confirm(`Set this user → ${plan}?`)){ loadUsers(); return; }
      tr.style.opacity=.5;
      try{ await api(`/superadmin/users/${pk}/plan`,{method:"POST",body:JSON.stringify({plan})}); await loadUsers(); }
      catch(err){ showErr(err); tr.style.opacity=1; }
    };
    tr.querySelector(".extend").onclick=async()=>{
      tr.style.opacity=.5;
      try{ await api(`/superadmin/users/${pk}/trial`,{method:"POST",body:JSON.stringify({days:7})}); await loadUsers(); }
      catch(err){ showErr(err); tr.style.opacity=1; }
    };
    const shortenBtn=tr.querySelector(".shorten");
    if(shortenBtn) shortenBtn.onclick=async()=>{
      tr.style.opacity=.5;
      try{ await api(`/superadmin/users/${pk}/trial`,{method:"POST",body:JSON.stringify({days:-7})}); await loadUsers(); }
      catch(err){ showErr(err); tr.style.opacity=1; }
    };
  });

  // --- Promo codes: create + enable/disable ---
  const cp=main.querySelector(".createpromo");
  if(cp) cp.onclick=async()=>{
    const perr=main.querySelector("#perr");
    const code=(main.querySelector(".pcode").value||"").trim();
    const plan=main.querySelector(".pplan").value;
    const durationDays=parseInt(main.querySelector(".pdays").value,10);
    const maxRaw=(main.querySelector(".pmax").value||"").trim();
    const note=(main.querySelector(".pnote").value||"").trim()||null;
    if(!code){ perr.textContent="Enter a code."; return; }
    try{
      await api("/superadmin/promo-codes",{method:"POST",body:JSON.stringify({code,plan,durationDays,maxRedemptions:maxRaw?parseInt(maxRaw,10):null,note})});
      await loadUsers();
    }catch(e){ perr.textContent="Error: "+(e.detail||e.message||e); }
  };
  main.querySelectorAll("tr[data-promo]").forEach(tr=>{
    const pk=tr.getAttribute("data-promo");
    tr.querySelector(".togglepromo").onclick=async()=>{
      tr.style.opacity=.5;
      try{ await api(`/superadmin/promo-codes/${pk}/toggle`,{method:"POST"}); await loadUsers(); }
      catch(err){ showErr(err); tr.style.opacity=1; }
    };
  });

  // --- Model utilization: bucket + scope toggles + manual refresh ---
  main.querySelectorAll(".ubtn").forEach(b=>{
    b.onclick=async()=>{ STATE.llmBucket=b.getAttribute("data-bucket"); await loadUsers().catch(showErr); };
  });
  main.querySelectorAll(".uscope").forEach(b=>{
    b.onclick=async()=>{ STATE.llmScope=b.getAttribute("data-scope"); await loadUsers().catch(showErr); };
  });
  const uref=main.querySelector(".urefresh");
  if(uref) uref.onclick=async()=>{ uref.textContent="…"; try{ await api("/superadmin/llm-usage/refresh",{method:"POST"}); await loadUsers(); }catch(e){ showErr(e); uref.textContent="↻"; } };
}

// v1.1.2 · top-right toast for errors + success confirmations (feedback #toast)
function toast(msg, kind){
  let wrap=document.getElementById("toastwrap");
  if(!wrap){ wrap=document.createElement("div"); wrap.id="toastwrap";
    wrap.style.cssText="position:fixed;top:64px;right:16px;z-index:600;display:flex;flex-direction:column;gap:8px;max-width:340px";
    document.body.appendChild(wrap); }
  const c=kind==="error"?"#e0665e":kind==="ok"?"#46d29a":"#E2BC68";
  const t=document.createElement("div"); t.textContent=msg;
  t.style.cssText=`background:var(--surface,#20242c);border:1px solid ${c};border-left:3px solid ${c};color:var(--ink,#e6eaf0);padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;transform:translateX(12px);transition:opacity .18s,transform .18s`;
  wrap.appendChild(t); requestAnimationFrame(()=>{ t.style.opacity="1"; t.style.transform="none"; });
  setTimeout(()=>{ t.style.opacity="0"; t.style.transform="translateX(12px)"; setTimeout(()=>t.remove(),200); }, kind==="error"?6000:3200);
}
function showErr(e){ const m="Error: "+(e.detail||e.code||e); const el=document.getElementById("cerr"); if(el) el.textContent=m; toast(m,"error"); }
function showOk(m){ toast(m,"ok"); }

// ── Schema library — full-page tab (multi-column card grid + detail editor) ──
let SCHEMA_STATE={schemaSel:null,edit:[],filter:"all"};
const FIELD_TYPES=["string","number","date","object","array"];
const _ST={proposed:'#e0b050',approved:'#46d29a',rejected:'var(--rose)'};

async function loadSchemas(){
  const d=await api("/superadmin/schema-library").catch(()=>({schemas:[]}));
  STATE.schemas=d.schemas||[];
  paintSchemas();
}

function paintSchemas(){
  if(SCHEMA_STATE.schemaSel){ paintSchemaDetail(); return; }
  const main=$('<main></main>');
  let schemas=STATE.schemas||[];
  const c={proposed:0,approved:0,rejected:0}; schemas.forEach(s=>c[s.status]=(c[s.status]||0)+1);
  const fil=SCHEMA_STATE.filter;
  const shown=fil==="all"?schemas:schemas.filter(s=>s.status===fil);
  const byDomain={}; shown.forEach(s=>{const k=s.domain||'other';(byDomain[k]=byDomain[k]||[]).push(s);});
  const domains=Object.keys(byDomain).sort();
  const card=s=>`
    <div class="scard" style="border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:var(--bg1);display:flex;flex-direction:column;gap:6px">
      <div class="row between" style="align-items:start;gap:6px">
        <div style="min-width:0"><div class="mono" style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.typeSlug)}</div><div class="muted" style="font-size:10px">${esc(s.label)}</div></div>
        <span style="font-size:9px;font-weight:700;text-transform:uppercase;color:${_ST[s.status]};flex-shrink:0">${s.status==='approved'?'✓':s.status==='rejected'?'✕':'●'} ${esc(s.status)}</span>
      </div>
      <div class="muted" style="font-size:10px">${s.fieldCount} fields · v${s.version}</div>
      ${s.notes?`<div class="muted" style="font-size:10px;line-height:1.4;max-height:42px;overflow:hidden">${esc(s.notes.slice(0,110))}</div>`:''}
      <div class="row" style="gap:5px;margin-top:auto;padding-top:4px">
        <button class="btn sm sedit" data-pk="${s.pk}">Edit</button>
        ${s.status!=='approved'?`<button class="btn sm sapp" data-pk="${s.pk}" style="background:#46d29a;color:#0a1f16">✓</button>`:''}
        ${s.status!=='rejected'?`<button class="btn ghost sm srej" data-pk="${s.pk}">✕</button>`:''}
      </div>
    </div>`;
  const sections=domains.map(dom=>`
    <div style="margin-bottom:20px">
      <div class="muted" style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-weight:700">${esc(dom)} <span style="color:var(--ink3)">(${byDomain[dom].length})</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px">${byDomain[dom].map(card).join("")}</div>
    </div>`).join("");
  const chip=(v,l,n)=>`<button class="btn sm sfil${fil===v?'':' ghost'}" data-f="${v}">${l}${n!=null?` <span style="opacity:.65">${n}</span>`:''}</button>`;
  main.innerHTML=`
    <div class="row between" style="padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:52px;background:var(--bg1,#111);z-index:2">
      <div class="row" style="gap:6px;align-items:center">
        <span style="font-weight:600">Schema library</span>
        ${chip("all","All",schemas.length)} ${chip("proposed","Proposed",c.proposed)} ${chip("approved","Approved",c.approved)} ${chip("rejected","Rejected",c.rejected)}
      </div>
      <div class="toolbar" style="gap:6px">
        <input class="sgen" placeholder="new type (e.g. purchase_order)" style="width:210px;font-size:12px;padding:5px 8px;text-transform:lowercase">
        <button class="btn sm sgenbtn">✨ Generate</button>
      </div>
    </div>
    <div style="padding:16px;overflow:auto">${sections||'<div class="muted" style="padding:50px;text-align:center">No schemas in this view.</div>'}</div>`;
  app.querySelector("main")?.remove(); app.appendChild(main);
  main.querySelectorAll(".sfil").forEach(b=>b.onclick=()=>{ SCHEMA_STATE.filter=b.dataset.f; paintSchemas(); });
  const genI=main.querySelector(".sgen");
  main.querySelector(".sgenbtn").onclick=async(e)=>{ const t=(genI.value||"").trim(); if(!t)return; e.target.textContent="Generating…";e.target.disabled=true;
    try{ const row=await api("/superadmin/schema-library/generate",{method:"POST",body:JSON.stringify({typeSlug:t})}); SCHEMA_STATE.schemaSel=row.pk; await loadSchemas(); }
    catch(err){ alert("Generate failed: "+(err.detail||err.code||JSON.stringify(err))); e.target.textContent="✨ Generate";e.target.disabled=false; } };
  main.querySelectorAll(".sedit").forEach(b=>b.onclick=()=>{ SCHEMA_STATE.schemaSel=parseInt(b.dataset.pk); paintSchemas(); });
  main.querySelectorAll(".sapp").forEach(b=>b.onclick=()=>setSchemaStatus(parseInt(b.dataset.pk),"approved"));
  main.querySelectorAll(".srej").forEach(b=>b.onclick=()=>{ if(confirm("Reject this schema?")) setSchemaStatus(parseInt(b.dataset.pk),"rejected"); });
}

async function setSchemaStatus(pk,status){ try{ await api(`/superadmin/schema-library/${pk}/status`,{method:"POST",body:JSON.stringify({status})}); await loadSchemas(); }catch(e){ alert("Failed: "+(e.detail||e.code||e)); } }

function paintSchemaDetail(){
  const s=(STATE.schemas||[]).find(x=>x.pk===SCHEMA_STATE.schemaSel);
  if(!s){ SCHEMA_STATE.schemaSel=null; paintSchemas(); return; }
  const main=$('<main></main>');
  SCHEMA_STATE.edit=Object.entries(s.fields||{}).map(([name,def])=>({name,type:(def&&def.type)||"string",required:!!(def&&def.required),desc:(def&&def.description)||"",sub:Object.keys((def&&def.items&&def.items.properties)||(def&&def.properties)||{}).join(", ")}));
  main.innerHTML=`
    <div class="row between" style="padding:12px 16px;border-bottom:1px solid var(--line);align-items:center;position:sticky;top:0;background:var(--bg1,#111);z-index:2">
      <button class="btn ghost sm sback">← All schemas</button>
      <div class="row" style="gap:6px">
        <button class="btn sm sapprove" ${s.status==='approved'?'disabled':''} style="background:#46d29a;color:#0a1f16">✓ Approve</button>
        <button class="btn ghost sm sreject">Reject</button>
        <button class="btn ghost sm sregen">↻ Regenerate</button>
      </div>
    </div>
    <div style="padding:18px 24px;overflow:auto;max-width:1000px">
      <div style="font-weight:600;font-size:16px">${esc(s.label)} <span class="muted mono" style="font-size:12px">${esc(s.typeSlug)} · v${s.version} · <span style="color:${_ST[s.status]}">${esc(s.status)}</span> · ${esc(s.model||'')}</span></div>
      ${s.notes?`<div style="background:var(--bg2);border-radius:6px;padding:9px 11px;margin:10px 0;font-size:11px;color:var(--ink2)"><b>🧠 AI rationale:</b> ${esc(s.notes)}</div>`:''}
      <input class="sdesc" value="${esc(s.description||'')}" placeholder="description" style="width:100%;margin-bottom:12px;font-size:12px;padding:6px 9px">
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:8px">Fields · edit / add / delete · set type=array (or object) + list sub-fields for a multi-value row</div>
      <div class="sfields" style="display:flex;flex-direction:column;gap:5px"></div>
      <button class="btn ghost sm saddfield" style="margin-top:10px">+ Add field</button>
      <div style="margin-top:16px;display:flex;gap:10px;align-items:center"><button class="btn ssave">Save edits</button><span class="ssaved" style="font-size:11px;color:#46d29a"></span></div>
    </div>`;
  app.querySelector("main")?.remove(); app.appendChild(main);
  main.querySelector(".sback").onclick=()=>{ SCHEMA_STATE.schemaSel=null; paintSchemas(); };
  main.querySelector(".saddfield").onclick=()=>{ SCHEMA_STATE.edit.push({name:"",type:"string",required:false,desc:"",sub:""}); renderSchemaFields(main); };
  main.querySelector(".ssave").onclick=()=>saveSchema(s,main);
  main.querySelector(".sapprove").onclick=()=>setSchemaStatus(s.pk,"approved");
  main.querySelector(".sreject").onclick=()=>{ if(confirm("Reject this schema?")) setSchemaStatus(s.pk,"rejected"); };
  main.querySelector(".sregen").onclick=async()=>{ if(!confirm("Regenerate with the AI? Creates a new version.")) return; try{ const row=await api("/superadmin/schema-library/generate",{method:"POST",body:JSON.stringify({typeSlug:s.typeSlug,label:s.label})}); SCHEMA_STATE.schemaSel=row.pk; await loadSchemas(); }catch(e){ alert("Regenerate failed: "+(e.detail||e.code||e)); } };
  renderSchemaFields(main);
}

function renderSchemaFields(main){
  const wrap=main.querySelector(".sfields"); if(!wrap) return;
  wrap.innerHTML=SCHEMA_STATE.edit.map((f,i)=>{const arr=(f.type==='array'||f.type==='object');return `
    <div class="srowf" data-i="${i}" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <input class="fname" value="${esc(f.name)}" placeholder="field_name" style="flex:1 1 160px;font-size:12px;padding:4px 7px">
      <select class="ftype" style="font-size:12px;padding:4px">${FIELD_TYPES.map(t=>`<option value="${t}" ${f.type===t?'selected':''}>${t}</option>`).join("")}</select>
      <label style="font-size:10px;display:flex;align-items:center;gap:3px"><input type="checkbox" class="freq" ${f.required?'checked':''}>req</label>
      <input class="fsub" value="${esc(f.sub)}" placeholder="${arr?'sub-fields: a, b, c':'—'}" ${arr?'':'disabled'} style="flex:1 1 200px;font-size:12px;padding:4px 7px;opacity:${arr?1:.4}">
      <button class="fdel" style="background:none;border:none;color:var(--ink3);cursor:pointer;font-size:16px">×</button>
    </div>`;}).join("");
  wrap.querySelectorAll(".srowf").forEach(row=>{const i=parseInt(row.dataset.i);
    row.querySelector(".fname").oninput=e=>SCHEMA_STATE.edit[i].name=e.target.value;
    row.querySelector(".ftype").onchange=e=>{SCHEMA_STATE.edit[i].type=e.target.value;renderSchemaFields(main);};
    row.querySelector(".freq").onchange=e=>SCHEMA_STATE.edit[i].required=e.target.checked;
    row.querySelector(".fsub").oninput=e=>SCHEMA_STATE.edit[i].sub=e.target.value;
    row.querySelector(".fdel").onclick=()=>{SCHEMA_STATE.edit.splice(i,1);renderSchemaFields(main);};
  });
}

function buildSchemaFields(){ const out={}; for(const f of SCHEMA_STATE.edit){const name=(f.name||"").trim();if(!name)continue;const def={type:f.type};if(f.required)def.required=true;if(f.desc)def.description=f.desc;if((f.type==='array'||f.type==='object')&&f.sub){const props=Object.fromEntries(f.sub.split(",").map(x=>x.trim()).filter(Boolean).map(x=>[x,{type:"string"}]));if(f.type==='array')def.items={type:"object",properties:props};else def.properties=props;}out[name]=def;} return out; }

async function saveSchema(s,main){ const fields=buildSchemaFields(); if(!Object.keys(fields).length){alert("Add at least one named field.");return;}
  try{ await api(`/superadmin/schema-library/${s.pk}`,{method:"PATCH",body:JSON.stringify({fields,description:main.querySelector(".sdesc").value})}); await loadSchemas(); const n=document.querySelector(".ssaved"); if(n)n.textContent="Saved ✓"; }
  catch(e){ alert("Save failed: "+(e.detail||e.code||JSON.stringify(e))); } }

// ── Live QA Tracker — server-persisted status/issue/resolution + live Run ────
let QA={seed:null,results:{},active:'_cross_doc',search:'',flat:[],domains:{}};
const QA_CYCLE=['untested','pass','fail','flaky'];
const QA_COL={untested:'#8a94a6',pass:'#46d29a',fail:'#e5675f',flaky:'#e0b050'};

async function loadQa(){
  const d=await api("/superadmin/qa").catch(()=>({seed:{types:[],questions:{}},results:{}}));
  QA.seed=d.seed||{types:[],questions:{}}; QA.results=d.results||{};
  const q=QA.seed.questions||{}, flat=[];
  (q._cross_doc||[]).forEach((t,i)=>flat.push({id:'x'+i,type:'_cross_doc',q:t}));
  (QA.seed.types||[]).forEach(tp=>(q[tp.slug]||[]).forEach((t,j)=>flat.push({id:tp.slug+'-'+j,type:tp.slug,q:t})));
  Object.entries(QA.results).forEach(([qid,r])=>{ if(r.custom) flat.push({id:qid,type:r.docType||'_cross_doc',q:r.question,custom:true}); });
  QA.flat=flat;
  const dom={}; (QA.seed.types||[]).forEach(t=>{(dom[t.domain]=dom[t.domain]||[]).push(t);}); QA.domains=dom;
  paintQa();
}
function qaRec(id){ return QA.results[id]||(QA.results[id]={status:'untested',issue:'',resolution:''}); }
// Lightweight markdown → HTML for answer previews (GFM tables + bold), no dependency.
function mdLite(s){
  const lines=esc(String(s||'')).split('\n'); const out=[]; let tbl=null;
  const flush=()=>{ if(tbl){ out.push('<table class="mdt">'+tbl.map((r,i)=>'<tr>'+r.map(c=>`<${i?'td':'th'}>${c}</${i?'td':'th'}>`).join('')+'</tr>').join('')+'</table>'); tbl=null; } };
  for(const ln of lines){
    if(/^\s*\|.*\|\s*$/.test(ln)){
      if(/^\s*\|[\s:|-]+\|\s*$/.test(ln)){continue;}          // separator row
      if(!tbl)tbl=[]; tbl.push(ln.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
    } else { flush(); if(ln.trim())out.push(ln+'<br>'); }
  }
  flush();
  return out.join('').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(<br>)+$/,'');
}

function qaStats(){ let p=0,f=0,fl=0; QA.flat.forEach(r=>{const s=(QA.results[r.id]||{}).status||'untested'; if(s==='pass')p++;else if(s==='fail')f++;else if(s==='flaky')fl++;}); return {total:QA.flat.length,pass:p,fail:f,flaky:fl,tested:p+f+fl}; }

function paintQa(){
  if(!document.getElementById("qaStyle")){ document.head.appendChild($(`<style id="qaStyle">
    .qtb{display:block;width:100%;text-align:left;padding:6px 9px;border-radius:6px;font-size:12px;color:var(--ink2,#c9d0dc);background:none;border:none;cursor:pointer}
    .qtb:hover{background:var(--line)} .qtb.on{background:var(--gold,#E2BC68);color:#1a1710;font-weight:700}
    .qdh{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:9px 8px 3px}
    .qtable table{border-collapse:collapse;width:100%} .qtable th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);padding:7px 9px;border-bottom:1px solid var(--line)}
    .qtable td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;font-size:12.5px}
    .qedit{border-radius:5px;padding:3px 5px;outline:none} .qedit:focus{background:var(--bg0,#0f141c);box-shadow:0 0 0 2px var(--gold,#E2BC68)66}
    .qedit:empty::before{content:'—';color:var(--ink3)}
    .qans{margin-top:6px;padding:7px 9px;background:var(--bg1);border-radius:6px;font-size:11.5px;color:var(--ink2,#c9d0dc);max-height:200px;overflow:auto;line-height:1.45}
    .qans .mdt{border-collapse:collapse;margin:5px 0;width:auto}
    .qans .mdt th,.qans .mdt td{border:1px solid var(--line);padding:2px 8px;text-align:left;font-size:11px;white-space:nowrap}
    .qans .mdt th{color:var(--ink3);font-weight:600;background:rgba(255,255,255,.03)}
  </style>`)); }
  const s=qaStats();
  const kpi=(n,l,c)=>`<div class="kpi"><div class="n mono" style="${c?`color:${c}`:''}">${n}</div><div class="l">${l}</div></div>`;
  let rail=`<button class="qtb ${QA.active==='_cross_doc'?'on':''}" data-t="_cross_doc">★ Cross-document</button>`;
  Object.keys(QA.domains).sort().forEach(dom=>{
    rail+=`<div class="qdh">${esc(dom.replace(/_/g,' '))}</div>`;
    QA.domains[dom].forEach(t=>{ const n=(QA.seed.questions[t.slug]||[]).length;
      rail+=`<button class="qtb ${QA.active===t.slug?'on':''}" data-t="${t.slug}" title="${esc(t.label)}">${esc(t.label)} <span class="mono" style="color:inherit;opacity:.6;font-size:10px">${n}</span></button>`; });
  });
  const main=$('<main style="padding:0 0 88px"></main>');
  main.innerHTML=`
    <div style="display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center">
      ${kpi(s.total,'Total')}${kpi(s.tested,'Tested')}${kpi(s.pass,'Pass',QA_COL.pass)}${kpi(s.fail,'Fail',QA_COL.fail)}${kpi(s.flaky,'Flaky',QA_COL.flaky)}
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <input class="qsearch" placeholder="Search questions…" style="padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg1);color:inherit;font:inherit">
        <button class="btn sm qadd">+ Add</button><button class="btn ghost sm qexport">Export</button>
      </div>
    </div>
    <div style="display:flex">
      <div style="width:216px;flex:0 0 216px;border-right:1px solid var(--line);padding:9px;overflow-y:auto;max-height:72vh">${rail}</div>
      <div style="flex:1;min-width:0;padding:10px 14px"><div class="qtable"></div></div>
    </div>`;
  app.querySelector("main")?.remove(); app.appendChild(main);
  main.querySelector(".qsearch").oninput=e=>{QA.search=e.target.value;renderQaTable(main);};
  main.querySelector(".qadd").onclick=qaAdd;
  main.querySelector(".qexport").onclick=qaExport;
  // Selecting a type only changes the TABLE — repaint just that + re-highlight the rail
  // in place, so the rail keeps its scroll position (feedback #42) and we skip a full rebuild.
  main.querySelectorAll(".qtb").forEach(b=>b.onclick=()=>{
    QA.active=b.dataset.t;
    main.querySelectorAll(".qtb").forEach(x=>x.classList.toggle("on",x.dataset.t===QA.active));
    renderQaTable(main);
  });
  renderQaTable(main);
}
function renderQaTable(main){
  let rows=QA.flat.filter(r=>r.type===QA.active);
  if(QA.search){const q=QA.search.toLowerCase();rows=rows.filter(r=>(r.q||'').toLowerCase().includes(q));}
  const wrap=main.querySelector(".qtable");
  if(!rows.length){wrap.innerHTML='<div style="padding:28px;color:var(--ink3)">No questions here. Add one above.</div>';return;}
  wrap.innerHTML=`<table><thead><tr><th style="text-align:left;background:var(--bg2);font-weight:700;color:var(--ink);padding:8px 10px;border-bottom:2px solid var(--gold2)">Question</th><th style="background:var(--bg2);font-weight:700;color:var(--ink);padding:8px 10px;border-bottom:2px solid var(--gold2)">Status</th><th style="text-align:left;background:var(--bg2);font-weight:700;color:var(--ink);padding:8px 10px;border-bottom:2px solid var(--gold2)">Issue</th><th style="text-align:left;background:var(--bg2);font-weight:700;color:var(--ink);padding:8px 10px;border-bottom:2px solid var(--gold2)">Resolution</th><th style="background:var(--bg2);font-weight:700;color:var(--ink);padding:8px 10px;border-bottom:2px solid var(--gold2)"></th></tr></thead><tbody>`+
    rows.map(r=>{const rc=QA.results[r.id]||{status:'untested'};const st=rc.status||'untested';
      return `<tr data-id="${r.id}">
        <td style="max-width:340px">${r.type!=='_cross_doc'?`<span class="mono" style="font-size:9.5px;color:var(--ink3)">${esc(r.type)}</span> `:''}${esc(r.q)}${rc.lastAnswer?`<div class="qans">${mdLite(rc.lastAnswer.slice(0,900))}</div>`:''}</td>
        <td><span class="qpill" data-id="${r.id}" style="cursor:pointer;display:inline-block;color:${QA_COL[st]};border:1px solid ${QA_COL[st]}66;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap">${st}</span></td>
        <td><div class="qedit" data-id="${r.id}" data-f="issue" contenteditable style="min-width:110px;min-height:16px;color:var(--ink2)">${esc(rc.issue||'')}</div></td>
        <td><div class="qedit" data-id="${r.id}" data-f="resolution" contenteditable style="min-width:110px;min-height:16px;color:var(--ink2)">${esc(rc.resolution||'')}</div></td>
        <td style="white-space:nowrap"><button class="btn sm qrun" data-id="${r.id}">▶ Run</button>${r.custom?` <button class="btn ghost sm qdel" data-id="${r.id}" title="Delete">✕</button>`:''}</td>
      </tr>`;}).join('')+`</tbody></table>`;
  wrap.querySelectorAll(".qpill").forEach(p=>p.onclick=()=>qaCycle(p.dataset.id));
  wrap.querySelectorAll(".qedit").forEach(e=>e.onblur=()=>qaSaveField(e.dataset.id,e.dataset.f,e.textContent.trim()));
  wrap.querySelectorAll(".qrun").forEach(b=>b.onclick=()=>qaRun(b.dataset.id,b));
  wrap.querySelectorAll(".qdel").forEach(b=>b.onclick=()=>qaDel(b.dataset.id));
}
async function qaCycle(id){const rc=qaRec(id);rc.status=QA_CYCLE[(QA_CYCLE.indexOf(rc.status||'untested')+1)%4];const r=QA.flat.find(x=>x.id===id)||{};
  api(`/superadmin/qa/${id}`,{method:"PUT",body:JSON.stringify({status:rc.status,questionText:r.q,docType:r.type})}).catch(()=>{});paintQa();}
async function qaSaveField(id,f,v){const rc=qaRec(id);rc[f]=v;const r=QA.flat.find(x=>x.id===id)||{};
  api(`/superadmin/qa/${id}`,{method:"PUT",body:JSON.stringify(f==='issue'?{issue:v,questionText:r.q,docType:r.type}:{resolution:v,questionText:r.q,docType:r.type})}).catch(()=>{});}
async function qaRun(id,btn){const r=QA.flat.find(x=>x.id===id);if(!r)return;const t=btn.textContent;btn.textContent="…";btn.disabled=true;
  try{const d=await api("/superadmin/qa/run",{method:"POST",body:JSON.stringify({qid:id,question:r.q})});
    (QA.results[id]=QA.results[id]||{status:'untested'}).lastAnswer=d.answer||"(empty)";renderQaTable(app.querySelector("main"));}
  catch(e){alert("Run failed: "+(e.detail||e.code||e));btn.textContent=t;btn.disabled=false;}}
async function qaDel(id){if(!confirm("Delete this custom question?"))return;await api(`/superadmin/qa/${id}`,{method:"DELETE"}).catch(()=>{});delete QA.results[id];await loadQa();}
async function qaAdd(){let q;const typeName=QA.active==='_cross_doc'?'Cross-document':QA.active;
  while(true){q=prompt("New test question for '"+typeName+"':");if(q===null)return;if(!q||!q.trim()){alert("Please enter a question.");continue;}break;}
  const d=await api("/superadmin/qa/custom",{method:"POST",body:JSON.stringify({docType:QA.active,question:q.trim()})}).catch(()=>{alert("Add failed");return null;});
  if(d)await loadQa();}
function qaExport(){const out=QA.flat.map(r=>{const rc=QA.results[r.id]||{};return{type:r.type,question:r.q,status:rc.status||'untested',issue:rc.issue||'',resolution:rc.resolution||'',lastAnswer:rc.lastAnswer||''};});

function _compressImg(file, maxDim=1280, q=0.7){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>{ const img=new Image();
    img.onload=()=>{ const sc=Math.min(1,maxDim/Math.max(img.width,img.height)); const c=document.createElement("canvas");
      c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",q)); }; img.onerror=rej; img.src=e.target.result; }; r.onerror=rej; r.readAsDataURL(file); });
}

// ── Reprocess — propagate a root-cause parse/extract fix to affected docs ────
const REPROC={symptoms:[],symptom:"",docType:"",scan:null,busy:false};
async function loadReprocess(){
  if(!REPROC.symptoms.length){
    const d=await api("/superadmin/reprocess/symptoms").catch(()=>({symptoms:[]}));
    REPROC.symptoms=d.symptoms||[];
    if(REPROC.symptoms[0]) REPROC.symptom=REPROC.symptoms[0].key;
  }
  paintReprocess();
}
function reprocNeedsType(){ const s=REPROC.symptoms.find(x=>x.key===REPROC.symptom); return s&&s.needsDocType; }
function paintReprocess(){
  const main=$('<main></main>');
  const opts=REPROC.symptoms.map(s=>`<option value="${s.key}" ${s.key===REPROC.symptom?'selected':''}>${esc(s.label)}</option>`).join("");
  const sc=REPROC.scan;
  const owners=sc&&sc.byOwner||[];
  const sample=sc&&sc.sample||[];
  const resultHtml = !sc ? '' : (sc.total===0
    ? `<div class="card" style="margin-top:14px;color:var(--emerald)">✓ No documents currently show this symptom — nothing to reprocess.</div>`
    : `<div class="card" style="margin-top:14px">
         <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
           <div><b style="font-size:18px">${sc.total}</b> document${sc.total===1?'':'s'} across <b>${owners.length}</b> owner${owners.length===1?'':'s'} would benefit.</div>
           <button class="btn" id="rpRun" ${REPROC.busy?'disabled':''}>${REPROC.busy?'Enqueuing…':`Re-ingest all ${sc.total}`}</button>
         </div>
         <div class="wrap" style="margin-top:12px;overflow-x:auto"><table style="white-space:nowrap">
           <thead><tr><th>Owner</th><th style="text-align:right">Docs</th></tr></thead>
           <tbody>${owners.map(o=>`<tr><td>${esc(o.ownerEmail||('user '+o.ownerPk))}</td><td style="text-align:right">${o.count}</td></tr>`).join("")}</tbody>
         </table></div>
         <details style="margin-top:12px"><summary style="cursor:pointer;color:var(--ink3)">Sample (${sample.length})</summary>
           <div class="wrap" style="margin-top:8px;overflow-x:auto"><table style="white-space:nowrap;font-size:12px">
             <thead><tr><th>pk</th><th>Owner</th><th>Name</th><th>Type</th><th>Reason</th></tr></thead>
             <tbody>${sample.map(r=>`<tr><td class="mono">${r.pk}</td><td>${esc(r.ownerEmail||r.ownerPk)}</td><td>${esc(r.name||'')}</td><td>${esc(r.docType||'')}</td><td style="color:var(--ink3)">${esc(r.reason||'')}</td></tr>`).join("")}</tbody>
           </table></div>
         </details>
       </div>`);
  main.innerHTML = `
    <div style="padding:16px 18px;max-width:900px">
      <h2 style="margin:0 0 4px">Scoped reprocess</h2>
      <p style="color:var(--ink3);margin:0 0 16px;font-size:13px">After a root-cause parsing/extraction fix ships, find every document — across <b>all owners</b> — that still shows the symptom, then re-run the full pipeline (re-parse → chunk → embed → extract) on just those. No blind whole-corpus overwrite.</p>
      <div class="card">
        <div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap">
          <label style="flex:1;min-width:260px">Symptom
            <select id="rpSymptom" style="width:100%;margin-top:4px">${opts}</select>
          </label>
          <label id="rpTypeWrap" style="display:${reprocNeedsType()?'block':'none'};min-width:180px">Doc type
            <input id="rpDocType" value="${esc(REPROC.docType)}" placeholder="e.g. resume" style="width:100%;margin-top:4px"/>
          </label>
          <button class="btn" id="rpScan" ${REPROC.busy?'disabled':''}>${REPROC.busy?'Scanning…':'Scan'}</button>
        </div>
      </div>
      ${resultHtml}
    </div>`;
  app.querySelector("main")?.remove(); app.appendChild(main);
  const sel=main.querySelector("#rpSymptom");
  if(sel) sel.onchange=()=>{ REPROC.symptom=sel.value; REPROC.scan=null; paintReprocess(); };
  const dt=main.querySelector("#rpDocType"); if(dt) dt.oninput=()=>{ REPROC.docType=dt.value; };
  const scanBtn=main.querySelector("#rpScan");
  if(scanBtn) scanBtn.onclick=async()=>{
    REPROC.busy=true; paintReprocess();
    try{ REPROC.scan=await api("/superadmin/reprocess/scan",{method:"POST",body:JSON.stringify({symptom:REPROC.symptom,docType:REPROC.docType||null})}); }
    catch(e){ showErr(e); }
    REPROC.busy=false; paintReprocess();
  };
  const runBtn=main.querySelector("#rpRun");
  if(runBtn) runBtn.onclick=async()=>{
    if(!confirm(`Re-ingest ${sc.total} document(s)? This re-parses + re-embeds + re-extracts them in the background.`)) return;
    REPROC.busy=true; paintReprocess();
    try{ const r=await api("/superadmin/reprocess/run",{method:"POST",body:JSON.stringify({symptom:REPROC.symptom,docType:REPROC.docType||null})});
      showOk(`Enqueued ${r.enqueued} document(s) for reprocessing${r.skipped?` (${r.skipped} skipped)`:''}.`); }
    catch(e){ showErr(e); }
    REPROC.busy=false; REPROC.scan=null; paintReprocess();
  };
}

      <td class="mono" style="font-size:12px">${(i.meta&&i.meta.users!=null)?i.meta.users+'u / '+(i.meta.documents||0)+'d':'—'}</td>
      <td><span class="tag" style="color:${STAT[i.status]||'var(--ink3)'}">${esc(i.status)}</span></td>
      <td class="muted mono" style="font-size:11px">${esc((i.lastSeen||'').slice(0,19))}</td>
      <td>${i.status!=='approved'?'<button class="btn sm ap">Approve</button> ':''}${i.status!=='revoked'?'<button class="btn ghost sm rv">Revoke</button>':''}</td>
    </tr>`).join("");
  const main=$('<main></main>');
  main.innerHTML=`
    ${f.fleetEnabled?'':'<div class="err" style="margin-bottom:12px">Fleet is not enabled — set DOCAIQ_FLEET_TOKEN on this (central) instance, and DOCAIQ_FLEET_ADMIN_URL + DOCAIQ_INSTANCE_ID + DOCAIQ_FLEET_TOKEN on each dedicated container.</div>'}
    <div class="muted" style="margin-bottom:12px;font-size:13px">Enterprise dedicated containers register here and send heartbeats. Approve a new deployment to admit it; revoke to cut it off. Green dot = seen recently.</div>
    <div class="kpis">${kpi(c.total,'instances')}${kpi(c.online,'online')}${kpi(c.pending,'pending')}${kpi(c.approved,'approved')}</div>
    <div class="err" id="cerr"></div>
    <div class="wrap" style="margin-top:14px"><table>
      <thead><tr><th>Instance</th><th>Version</th><th>Usage</th><th>Status</th><th>Last seen</th><th></th></tr></thead>
      <tbody>${body||'<tr><td colspan="6" class="muted" style="text-align:center;padding:20px">No instances registered.</td></tr>'}</tbody>
    </table></div>`;
  app.querySelector("main")?.remove();
  app.appendChild(main);
  main.querySelectorAll("tr[data-id]").forEach(tr=>{
    const id=tr.getAttribute("data-id");
    const act=async(a)=>{ tr.style.opacity=.5; try{ await api(`/superadmin/instances/${encodeURIComponent(id)}/${a}`,{method:"POST"}); await loadFleet(); }catch(e){ showErr(e); tr.style.opacity=1; } };
    tr.querySelector(".ap")?.addEventListener("click",()=>act("approve"));
    tr.querySelector(".rv")?.addEventListener("click",()=>act("revoke"));
  });
}

async function loadLlm(){
  const [prov,an,ops,pmods,pii,emb,ft]=await Promise.all([
    api("/superadmin/llm").then(r=>r.providers||[]),
    api("/superadmin/llm-analytics?days=30").catch(()=>null),
    api("/superadmin/ai-operations").catch(()=>null),
    api("/superadmin/provider-models").catch(()=>null),
    api("/superadmin/pii-config").catch(()=>null),
    api("/superadmin/embedding-config").catch(()=>null),
    api("/superadmin/feature-flags").catch(()=>null),
  ]);
  STATE.llm=prov; STATE.llmAn=an; STATE.aiOps=ops; STATE.providerModels=pmods; STATE.pii=pii; STATE.emb=emb; STATE.ft=ft; paintLlm();
}

const _money=(n)=>'$'+(Number(n)||0).toFixed(Math.abs(n)>=10?2:4);
const _tok=(n)=>{n=Number(n)||0;return n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(n);};

function llmAnalyticsHtml(an){
  if(!an) return '';
  const s=an.summary;
  const kpi=(label,w)=>`<div class="panel" style="flex:1;min-width:128px"><div class="muted" style="font-size:10px;text-transform:uppercase;letter-spacing:.06em">${label}</div><div style="font-size:22px;font-weight:700;margin-top:3px">${_money(w.cost)}</div><div class="muted mono" style="font-size:11px">${w.calls} calls · ${_tok(w.inTok+w.outTok)} tok</div></div>`;
  const maxc=Math.max(0.0001,...an.series.map(d=>d.cost));
  const bars=an.series.map(d=>`<div title="${d.date}: ${_money(d.cost)} · ${d.calls} calls" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:4px"><div style="width:72%;background:var(--emerald);border-radius:2px 2px 0 0;height:${Math.max(2,Math.round(d.cost/maxc*88))}px"></div></div>`).join('');
  const mrows=an.byModel.map(r=>`<tr><td class="mono" style="font-size:12px">${esc(r.key)}</td><td>${r.calls}</td><td class="mono" style="font-size:11px">${_tok(r.inTok)}/${_tok(r.outTok)}</td><td style="font-weight:600">${_money(r.cost)}</td><td class="muted mono" style="font-size:11px">${r.avgMs}ms</td><td>${r.errors?'<span style="color:var(--rose)">'+r.errors+'</span>':'0'}</td></tr>`).join('');
  const trows=an.byTask.map(r=>`<tr><td class="mono" style="font-size:12px">${esc(r.key)}</td><td>${r.calls}</td><td style="font-weight:600">${_money(r.cost)}</td></tr>`).join('');
  const drows=(an.topDocs||[]).map(r=>`<tr><td style="font-size:12.5px">${esc(r.docName)}</td><td>${r.calls}</td><td class="mono" style="font-size:11px">${_tok(r.tok)}</td><td style="font-weight:600">${_money(r.cost)}</td></tr>`).join('');
  const docSection = drows
    ? `<div class="panel" style="margin-bottom:18px"><div class="ph">By document — exact cost</div><div class="wrap"><table><thead><tr><th style="text-align:left">Document</th><th>Calls</th><th>Tokens</th><th>Cost</th></tr></thead><tbody>${drows}</tbody></table></div></div>`
    : `<div class="panel" style="margin-bottom:18px"><div class="ph">By document</div><div class="muted" style="padding:10px;font-size:12.5px">Exact per-document cost starts accruing now — as documents are extracted or re-extracted, each LLM call is tagged with its document. Until then, use <b>Avg / document</b> above.</div></div>`;
  return `
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      ${kpi('Today',s.today)}${kpi('Last 7 days',s.last7)}${kpi('This month',s.month)}${kpi('All time',s.allTime)}
      <div class="panel" style="flex:1;min-width:128px"><div class="muted" style="font-size:10px;text-transform:uppercase;letter-spacing:.06em">Avg / document</div><div style="font-size:22px;font-weight:700;margin-top:3px">${_money(an.avgPerDoc)}</div><div class="muted mono" style="font-size:11px">${an.docs} docs · ${_money(an.docExtractionCost)} extract</div></div>
    </div>
    <div class="panel" style="margin-bottom:14px"><div class="ph">Daily LLM cost · last 30 days</div><div style="display:flex;gap:2px;align-items:flex-end;height:96px;padding:6px 2px">${bars||'<div class="muted">no data</div>'}</div></div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px">
      <div class="panel" style="flex:2;min-width:360px"><div class="ph">By model</div><div class="wrap"><table><thead><tr><th style="text-align:left">Model</th><th>Calls</th><th>In/Out</th><th>Cost</th><th>Avg</th><th>Err</th></tr></thead><tbody>${mrows}</tbody></table></div></div>
      <div class="panel" style="flex:1;min-width:220px"><div class="ph">By task</div><div class="wrap"><table><thead><tr><th style="text-align:left">Task</th><th>Calls</th><th>Cost</th></tr></thead><tbody>${trows}</tbody></table></div></div>
    </div>
    ${docSection}`;
}

function opsHtml(data, providerModels){
  if(!data||!data.categories||!data.categories.length) return '';
  const pm=providerModels&&providerModels.providers||{};
  const costBadge=(t)=>{
    const c={'free':'var(--emerald)','cheap':'var(--gold2)','paid':'var(--rose)','local':'var(--ink3)'};
    return `<span class="tag" style="color:${c[t]||c.local};font-size:10px;padding:1px 8px">${t}</span>`;
  };
  const providerBadge=(p)=>{
    const c={dashscope:'#6c5ce7',google:'#4285f4',deepseek:'#10a37f',openrouter:'#ff7300',anthropic:'#d97757',openai:'#74aa9c',ollama:'#d4a574',local:'var(--ink3)'};
    return `<span class="tag" style="color:${c[p]||'var(--ink3)'};font-size:10px;padding:1px 8px">${p}</span>`;
  };
  const opRow=(op)=>`<tr>
    <td style="font-size:12.5px"><span class="muted mono" style="font-size:10px;margin-right:4px">${esc(op.id)}</span> ${esc(op.label)}</td>
    <td class="mono" style="font-size:12px"><span class="op-model" data-op="${esc(op.id)}" data-provider="${esc(op.provider)}">${esc(op.model)}</span>${op.envVar?`<div class="muted" style="font-size:9px">env: ${esc(op.envVar)}</div>`:''}</td>
    <td>${providerBadge(op.provider)}</td>
    <td>${costBadge(op.costTier)}</td>
    <td>${op.editable?`<button class="btn ghost sm op-edit" data-op="${esc(op.id)}" data-label="${esc(op.label)}" data-model="${esc(op.model)}" data-provider="${esc(op.provider)}" data-cost="${esc(op.costTier)}" style="font-size:11px">edit</button>`:`<span class="muted" style="font-size:11px" title="${esc(op.description||'')}">🔒</span>`}</td>
  </tr>`;
  // Collect all operations into a flat map
  const allOps={};
  data.categories.forEach(cat=>cat.operations.forEach(op=>{allOps[op.id]=op;}));
  // Key operations — the 6 you actually tune
  const KEY_IDS=['fact_extraction','classification','chat_general_fallback','vision_ocr','schema_architect','chat_critic'];
  const keyOps=KEY_IDS.map(id=>allOps[id]).filter(Boolean);
  const keyRows=keyOps.map(opRow).join('');
  // Full list grouped by category
  const catRows=data.categories.map(cat=>{
    const orows=cat.operations.map(opRow).join('');
    return `<details style="margin-bottom:4px"><summary style="cursor:pointer;font-weight:600;font-size:13px;padding:6px 0;color:var(--ink2)">${esc(cat.name)} <span class="muted" style="font-size:11px">(${cat.operations.length} ops)</span></summary><div class="wrap" style="margin-bottom:10px"><table><thead><tr><th>Operation</th><th>Model</th><th>Provider</th><th>Cost</th><th style="width:60px"></th></tr></thead><tbody>${orows}</tbody></table></div></details>`;
  }).join('');
  return `<h2 style="margin:16px 0 8px;font-size:16px">AI Operations</h2>
    <div class="muted" style="margin-bottom:12px;font-size:13px">Every AI operation and its current model. <b>edit</b> to pick from available models or type a custom one. Overrides are stored in routing config and survive restarts.</div>
    <div class="panel" style="margin-bottom:10px;padding:10px 14px">
      <div class="ph" style="margin-bottom:6px">⭐ Key operations — tune these first</div>
      <div class="wrap"><table><thead><tr><th>Operation</th><th>Model</th><th>Provider</th><th>Cost</th><th style="width:60px"></th></tr></thead><tbody>${keyRows}</tbody></table></div>
    </div>
    <details style="margin-bottom:4px"><summary style="cursor:pointer;font-weight:600;font-size:13px;padding:6px 0;color:var(--ink3)">All ${Object.keys(allOps).length} operations (advanced)</summary>
    ${catRows}
    </details>`;
}

function piiHtml(cfg){
  if(!cfg||!cfg.categories) return '';
  const cats=cfg.categories||{};
  const entries=[
    ['dates',     'Dates',     'DOB-style dates (YYYY-MM-DD, DD/MM/YYYY). Disable for extraction.'],
    ['names',     'Names',     'Person & org names. Search-critical — redacting breaks name queries.'],
    ['contact',   'Contact',   'Email addresses and phone numbers.'],
    ['govt_ids',  'Govt IDs',  'NRIC, Aadhaar, PAN, SSN, EIN, passport, national insurance.'],
    ['financial', 'Financial', 'Credit cards, IBAN, bank account numbers, SWIFT/BIC.'],
    ['network',   'Network',   'IPv4 addresses.'],
  ];
  const catRows=entries.map(([id,label,help])=>{
    const on=!!cats[id];
    return `<tr>
      <td><label style="cursor:pointer;display:flex;align-items:center;gap:6px"><input type="checkbox" class="pii-cat" data-cat="${id}" ${on?'checked':''}> <span style="font-weight:600;font-size:13px">${label}</span></label></td>
      <td class="muted" style="font-size:12px">${help}</td>
    </tr>`;
  }).join('');
  const onOff = cfg.enabled ? 'on' : 'off';
  return `<h2 style="margin:16px 0 8px;font-size:16px">PII redaction</h2>
    <div class="muted" style="margin-bottom:12px;font-size:13px">Mask sensitive content before sending to external LLM providers. Choose which categories to protect per compliance needs; the LLM response is detokenized back to real values.</div>
    <div class="panel" style="margin-bottom:10px;padding:10px 14px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
        <span style="font-weight:600;font-size:14px">Enable PII redaction</span>
        <button class="btn ${cfg.enabled?'':'ghost'} sm pii-tog">${onOff}</button>
      </div>
      <div class="wrap"><table><thead><tr><th style="width:140px">Category</th><th>What it masks</th></tr></thead><tbody>${catRows}</tbody></table></div>
    </div>`;
}
