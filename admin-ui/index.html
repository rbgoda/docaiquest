function featureFlagsHtml(flags){
  if(!flags||!flags.length) return '';
  const cats={};
  flags.forEach(f=>{ (cats[f.category]=cats[f.category]||[]).push(f); });
  const catHtml=Object.entries(cats).map(([cat,items])=>{
    const rows=items.map(f=>{
      const val=f.value;
      let input;
      if(f.type==='bool'){
        input=`<label style="cursor:pointer"><input type="checkbox" class="ft-tog" data-name="${esc(f.name)}" ${val?'checked':''}> <span style="font-size:12.5px;font-weight:600">${esc(f.label)}</span></label>`;
      }else if(f.type==='str'){
        input=`<input class="ft-str" data-name="${esc(f.name)}" type="text" value="${esc(val)}" style="width:120px;padding:3px 6px;font-size:12px"> <span style="font-size:12.5px;font-weight:600">${esc(f.label)}</span>`;
      }else{
        input=`<input class="ft-num" data-name="${esc(f.name)}" type="number" value="${val}" style="width:80px;padding:3px 6px;font-size:12px"> <span style="font-size:12.5px;font-weight:600">${esc(f.label)}</span>`;
      }
      return `<tr><td style="padding:4px 8px">${input}</td><td class="muted" style="font-size:11.5px;padding:4px 8px">${esc(f.help)}</td></tr>`;
    }).join('');
    return `<details open style="margin-bottom:4px"><summary style="cursor:pointer;font-weight:600;font-size:13px;padding:4px 0;color:var(--ink2)">${esc(cat)}</summary><table style="width:100%"><tbody>${rows}</tbody></table></details>`;
  }).join('');
  return `<h2 style="margin:16px 0 8px;font-size:16px">Feature toggles</h2>
    <div class="muted" style="margin-bottom:12px;font-size:13px">Pipeline on/off switches — stored in DB, survives restarts. DB override → env var → default. ⚠️ Toggling a pipeline off will affect live document processing.</div>
    <div class="panel" style="margin-bottom:10px;padding:10px 14px">
      ${catHtml}
    </div>`;
}

function modelManagerHtml(pm){
  if(!pm||!pm.providers) return '';
  const sections=Object.entries(pm.providers).map(([pid,p])=>{
    const defaults=new Set(p.defaults||[]);
    const tags=p.models.map(m=>{
      const isDefault=defaults.has(m);
      return `<span class="tag" style="font-size:10px;padding:1px 8px;margin:2px;display:inline-block;${isDefault?'opacity:.55':''}">${esc(m)}${isDefault?'':' <button class="mm-del" data-prov="${esc(pid)}" data-model="${esc(m)}" style="border:none;background:none;color:var(--rose);cursor:pointer;font-size:13px;padding:0;line-height:1;vertical-align:middle" title="Remove custom model">×</button>'}</span>`;
    }).join('');
    return `<tr>
      <td style="font-weight:600;text-transform:capitalize;font-size:13px">${esc(pid)}</td>
      <td><div style="display:flex;flex-wrap:wrap;align-items:center;gap:2px">${tags||'<span class="muted" style="font-size:11px">no models</span>'}</div></td>
      <td style="white-space:nowrap"><input class="mm-input" data-prov="${esc(pid)}" placeholder="model id…" style="width:180px;font-size:12px;padding:4px 8px;margin-right:4px"><button class="btn sm mm-add" data-prov="${esc(pid)}" style="font-size:11px">+</button></td>
    </tr>`;
  }).join('');
  return `<details style="margin-bottom:4px"><summary style="cursor:pointer;font-weight:600;font-size:13px;padding:6px 0;color:var(--ink2)">Manage models <span class="muted" style="font-size:11px">(per-provider available model list)</span></summary>
    <div class="muted" style="margin-bottom:6px;font-size:12px">Built-in defaults are dimmed and cannot be deleted. Custom models appear in operation edit dropdowns.</div>
    <div class="wrap" style="margin-bottom:10px"><table><thead><tr><th style="width:120px">Provider</th><th>Models</th><th style="width:260px">Add custom</th></tr></thead><tbody>${sections}</tbody></table></div>
  </details>`;
}

function paintLlm(){
  const src=(s)=>({db:'custom key',env:'env key',custom:'custom key',none:'no key'})[s]||s;
  const dot=(ok)=>`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${ok?'var(--emerald)':'var(--ink3)'};margin-right:6px"></span>`;
  const body=STATE.llm.map(p=>{
    const isCustom=!!p.custom;
    const delBtn=isCustom?` <button class="btn ghost sm del" style="color:var(--rose)">Del</button>`:'';
    const label=isCustom?(p.label||p.provider):p.provider;
    const baseUrlCell=isCustom?`<td class="mono" style="font-size:11px"><input class="burl" value="${esc(p.baseUrl||'')}" placeholder="https://…/v1" style="width:180px"></td>`:`<td class="muted" style="font-size:11px">—</td>`;
    const providerCell=isCustom?`${dot(p.configured)}<b>${esc(label)}</b><div class="muted mono" style="font-size:10px">${esc(p.provider)}</div>`:`${dot(p.configured)}${esc(p.provider)}`;
    return `<tr data-prov="${p.provider}"${isCustom?' data-custom="1"':''}>
      <td style="font-weight:600">${providerCell}</td>
      <td><button class="btn ${p.enabled?'':'ghost'} sm t-en">${p.enabled?'on':'off'}</button></td>
      <td class="mono" style="font-size:12px">${esc(src(p.keySource))}</td>
      ${baseUrlCell}
      <td><input class="key" type="password" placeholder="paste API key…" style="width:150px"></td>
      <td><input class="model" placeholder="default model (optional)" value="${esc(p.defaultModel||'')}" style="width:160px"></td>
      <td><button class="btn sm save">Save</button> <button class="btn ghost sm probe">Probe</button> <button class="btn ghost sm clr" style="color:var(--rose)">Clear</button>${delBtn}</td>
      <td class="probe-res mono" style="font-size:11px;color:var(--ink3)"></td>
    </tr>`;
  }).join("");
  const main=$('<main></main>');
  main.innerHTML=`
    <h2 style="margin:0 0 12px;font-size:16px">LLM usage &amp; cost</h2>
    ${llmAnalyticsHtml(STATE.llmAn)}
    <h2 style="margin:8px 0 8px;font-size:16px">Providers</h2>
    <div class="muted" style="margin-bottom:12px;font-size:13px">Configure LLM providers — toggle enable/disable (applies to every chat &amp; extraction), paste a runtime API key (encrypted at rest; overrides the env key), set an optional default model, and <b>Probe</b> to live-test the key. Per-tier LLM enable/disable is on the Plans tab.</div>
    <details class="panel" style="margin-bottom:14px"><summary style="font-weight:600">+ Add OpenAI-compatible provider</summary>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 0">
        <input class="cp-slug" placeholder="id (e.g. groq)" maxlength="24" style="width:110px">
        <input class="cp-label" placeholder="Label (e.g. Groq)" style="width:110px">
        <input class="cp-burl" placeholder="https://api.groq.com/openai/v1" style="width:220px">
        <input class="cp-key" type="password" placeholder="API key (optional)" style="width:150px">
        <button class="btn sm cp-add">Add</button>
        <span class="cp-err mono" style="font-size:11px;color:var(--rose)"></span>
      </div>
    </details>
    <div class="err" id="cerr"></div>
    <div class="wrap"><table>
      <thead><tr><th>Provider</th><th>Enabled</th><th>Key source</th><th>Base URL</th><th>Set / replace key</th><th>Default model</th><th></th><th>Probe</th></tr></thead>
      <tbody>${body}</tbody>
    </table></div>
    ${piiHtml(STATE.pii)}
    ${embeddingHtml(STATE.emb)}
    ${featureFlagsHtml(STATE.ft)}
    ${opsHtml(STATE.aiOps, STATE.providerModels)}
    ${modelManagerHtml(STATE.providerModels)}`;
  app.querySelector("main")?.remove();
  app.appendChild(main);
  // ── Add custom provider ──
  main.querySelector(".cp-add")?.addEventListener("click",async()=>{
    const slug=main.querySelector(".cp-slug").value.trim();
    const label=main.querySelector(".cp-label").value.trim();
    const baseUrl=main.querySelector(".cp-burl").value.trim();
    const apiKey=main.querySelector(".cp-key").value;
    const err=main.querySelector(".cp-err");
    if(!slug||!label||!baseUrl){ err.textContent='slug, label, and base URL are required'; return; }
    if(!/^[a-z0-9][a-z0-9_-]{0,23}$/.test(slug)){ err.textContent='slug: lowercase letters, digits, - or _ (max 24)'; return; }
    if(!/^https?:\/\/.+/.test(baseUrl)){ err.textContent='base URL must start with http(s)://'; return; }
    err.textContent='';
    const btn=main.querySelector(".cp-add"); btn.textContent='…';
    try{ await api("/superadmin/llm/custom",{method:"POST",body:JSON.stringify({slug,label,baseUrl,apiKey:apiKey||undefined})});
      main.querySelector(".cp-slug").value=''; main.querySelector(".cp-label").value='';
      main.querySelector(".cp-burl").value=''; main.querySelector(".cp-key").value='';
      await loadLlm(); }
    catch(e){ err.textContent=e.detail||'failed'; btn.textContent='Add'; }
  });
  // ── Providers ── save, probe, delete
  main.querySelectorAll("tr[data-prov]").forEach(tr=>{
    const prov=tr.getAttribute("data-prov");
    const isCustom=tr.hasAttribute("data-custom");
    tr.querySelector(".t-en").onclick=(e)=>{const on=e.target.textContent==='on';e.target.textContent=on?'off':'on';e.target.classList.toggle('ghost',on);};
    tr.querySelector(".save").onclick=async()=>{
      const body={enabled: tr.querySelector(".t-en").textContent==='on', defaultModel: tr.querySelector(".model").value};
      const key=tr.querySelector(".key").value; if(key) body.apiKey=key;
      if(isCustom){
        const burl=tr.querySelector(".burl"); if(burl) body.baseUrl=burl.value;
      }
      tr.style.opacity=.5;
      try{ await api(`/superadmin/llm/${prov}`,{method:"PATCH",body:JSON.stringify(body)}); await loadLlm(); }
      catch(err){ showErr(err); tr.style.opacity=1; }
    };
    tr.querySelector(".probe").onclick=async()=>{
      const cell=tr.querySelector(".probe-res"); cell.textContent='…';
      try{ const r=await api(`/superadmin/llm/${prov}/probe`,{method:"POST"});
        cell.style.color = r.ok?'var(--emerald)':'var(--rose)';
        cell.textContent = r.ok?`ok ${r.latencyMs}ms`:`fail: ${r.error||r.status||''}`;
      }catch(err){ cell.style.color='var(--rose)'; cell.textContent='error'; }
    };
    // Delete (custom providers only)
    const delBtn=tr.querySelector(".del");
    if(delBtn) delBtn.onclick=async()=>{
      if(!confirm(`Delete custom provider "${prov}"? This won't affect existing operation overrides.`)) return;
      delBtn.textContent='…';
      try{ await api(`/superadmin/llm/${prov}`,{method:"DELETE"}); await loadLlm(); }
      catch(err){ showErr(err); delBtn.textContent='Del'; }
    };
    // Clear key — removes DB override, falls back to env var
    const clrBtn=tr.querySelector(".clr");
    clrBtn.onclick=async()=>{
      if(!confirm(`Clear the DB-stored API key for ${prov}? The provider will fall back to its env-var key.`)) return;
      clrBtn.textContent='…';
      try{
        await api(`/superadmin/llm/${prov}`,{method:"PATCH",body:JSON.stringify({clearKey:true})});
        tr.querySelector(".key").value='';
        await loadLlm();
      }catch(err){ showErr(err); clrBtn.textContent='Clear'; }
    };
  });
  // ── AI Operations ── edit → provider + model picker + suggestions
  main.querySelectorAll(".op-edit").forEach(btn=>{
    btn.onclick=function(){
      const op=this.getAttribute("data-op");
      const opLabel=this.getAttribute("data-label")||op;
      const cur=this.getAttribute("data-model");
      const defaultProvider=this.getAttribute("data-provider");
      const td=this.closest("td");
      const pm=STATE.providerModels&&STATE.providerModels.providers||{};
      const costTier=this.getAttribute("data-cost")||'';
      // Guess current provider from model prefix
      const curProvider=Object.keys(pm).find(p=>cur.startsWith(p+'/'))||defaultProvider;
      // Build provider options (label + slug)
      const provOpts=Object.entries(pm).map(([pid,p])=>{
        const label=p.label||pid;
        return `<option value="${esc(pid)}" ${pid===curProvider?'selected':''}>${esc(label)}</option>`;
      }).join('');
      // Build model options for a given provider
      const buildModelOpts=(prov,selected)=>{
        const models=(pm[prov]&&pm[prov].models)||[];
        const opts=models.map(m=>`<option value="${esc(m)}" ${m===selected?'selected':''}>${esc(m)}</option>`).join('');
        const hasSel=models.includes(selected);
        return opts+(hasSel?'':`<option value="${esc(selected)}" selected>${esc(selected)} (current)</option>`)+'<option value="__other__">Other…</option>';
      };
      // Compute suggestion chips
      const suggestions=[];
      const seen=new Set(); seen.add(cur);
      // 1. Same-provider alternatives
      const sameModels=(pm[curProvider]&&pm[curProvider].models)||[];
      sameModels.forEach(m=>{ if(!seen.has(m)&&m!==cur){ suggestions.push({model:m, provider:curProvider, label:'same provider'}); seen.add(m); } });
      // 2. Free models from any provider
      Object.entries(pm).forEach(([pid,p])=>{
        (p.models||[]).forEach(m=>{
          if(!seen.has(m)&&(m.includes(':free')||m.includes('-free'))){
            suggestions.push({model:m, provider:pid, label:'free', tier:'free'}); seen.add(m);
          }
        });
      });
      // 3. One model from each other configured provider
      Object.entries(pm).forEach(([pid,p])=>{
        if(pid===curProvider) return;
        const m=(p.models||[]).find(x=>!seen.has(x));
        if(m){ suggestions.push({model:m, provider:pid, label:'alt provider'}); seen.add(m); }
      });
      const sugChips=suggestions.slice(0,6).map(s=>{
        const t=s.tier==='free'?'style="color:var(--emerald)"':'';
        return `<span class="op-sug" data-prov="${esc(s.provider)}" data-model="${esc(s.model)}" title="${esc(s.provider)} · ${s.label}" style="cursor:pointer;display:inline-block;font-size:10px;padding:1px 8px;margin:1px 3px;border:1px solid var(--ink3);border-radius:10px;white-space:nowrap" ${t}>${esc(s.label)}: ${esc(s.model)}</span>`;
      }).join('');
      td.innerHTML=`<div style="margin-bottom:2px"><span class="mono" style="font-size:10px;color:var(--ink3)">${esc(op)}</span> <span style="font-size:12px;font-weight:600">${esc(opLabel)}</span></div><div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px">
        <select class="op-provider" style="width:130px;font-size:12px;padding:4px 6px">
        ${provOpts}
      </select>
      <select class="op-override-model" style="width:160px;font-size:12px;padding:4px 6px">
        ${buildModelOpts(curProvider,cur)}
      </select>
        <input class="op-other-model" value="" style="width:140px;font-size:12px;padding:4px 8px;display:none" placeholder="type model id…">
        <button class="btn sm op-save" data-op="${esc(op)}" style="font-size:11px">save</button>
        <button class="btn ghost sm op-reset" data-op="${esc(op)}" style="font-size:11px">reset</button>
      </div>
      ${sugChips?`<div style="margin-top:4px"><span class="muted" style="font-size:9px;text-transform:uppercase;letter-spacing:.05em">suggestions:</span> ${sugChips}</div>`:''}`;
      const provSel=td.querySelector(".op-provider");
      const modelSel=td.querySelector(".op-override-model");
      const other=td.querySelector(".op-other-model");
      // Provider change → rebuild model options
      provSel.onchange=()=>{
        const newProv=provSel.value;
        const models=(pm[newProv]&&pm[newProv].models)||[];
        const prefix=newProv+'/';
        modelSel.innerHTML=buildModelOpts(newProv,'');
        if(models.length) modelSel.value=models[0];
        else{ modelSel.value='__other__'; other.style.display=''; modelSel.style.display='none'; other.value=prefix; other.focus(); }
      };
      modelSel.onchange=()=>{ if(modelSel.value==='__other__'){ other.style.display=''; modelSel.style.display='none'; other.focus(); } };
      // Suggestion chip click → auto-select provider + model
      td.querySelectorAll(".op-sug").forEach(chip=>{
        chip.onclick=()=>{
          const sp=chip.getAttribute("data-prov");
          const sm=chip.getAttribute("data-model");
          provSel.value=sp;
          modelSel.innerHTML=buildModelOpts(sp,sm);
          modelSel.value=sm;
          other.style.display='none'; modelSel.style.display='';
        };
      });
      td.querySelector(".op-save").onclick=async function(){
        let model=(modelSel.value==='__other__'||modelSel.style.display==='none')?other.value.trim():modelSel.value;
        if(!model||model==='__other__'){ showErr({detail:'select or type a model name'}); return; }
        // Prepend provider prefix so the gateway can route it (e.g. deepseek-chat → deepseek/deepseek-chat)
        const provider = provSel.value;
        if (!model.startsWith(provider + '/')) model = provider + '/' + model;
        td.textContent='…';
        try{ await api(`/superadmin/ai-operations/${op}`,{method:"PATCH",body:JSON.stringify({model})}); await loadLlm(); }
        catch(err){ showErr(err); td.textContent=cur; }
      };
      td.querySelector(".op-reset").onclick=async function(){
        td.textContent='…';
        try{ await api(`/superadmin/ai-operations/${op}`,{method:"PATCH",body:JSON.stringify({reset:true})}); await loadLlm(); }
        catch(err){ showErr(err); td.textContent=cur; }
      };
    };
  });
  // ── Model manager ── add/delete custom models per provider
  main.querySelectorAll(".mm-add").forEach(btn=>{
    btn.onclick=async function(){
      const prov=this.getAttribute("data-prov");
      const input=main.querySelector(`.mm-input[data-prov="${prov}"]`);
      const model=input.value.trim();
      if(!model){ showErr({detail:'enter a model name'}); return; }
      input.value=''; this.textContent='…';
      try{ await api(`/superadmin/provider-models/${prov}`,{method:"POST",body:JSON.stringify({model})}); await loadLlm(); }
      catch(err){ showErr(err); this.textContent='+'; }
    };
  });
  main.querySelectorAll(".mm-del").forEach(btn=>{
    btn.onclick=async function(){
      const prov=this.getAttribute("data-prov");
      const model=this.getAttribute("data-model");
      if(!confirm(`Remove "${model}" from ${prov}?`)) return;
      this.textContent='…';
      try{ await api(`/superadmin/provider-models/${prov}/${encodeURIComponent(model)}`,{method:"DELETE"}); await loadLlm(); }
      catch(err){ showErr(err); this.textContent='×'; }
    };
  });
  // ── PII config ── toggle + category checkboxes
  const piiTog=main.querySelector(".pii-tog");
  if(piiTog) piiTog.onclick=async()=>{
    const wasOn=piiTog.textContent==='on';
    piiTog.textContent='…';
    try{ await api("/superadmin/pii-config",{method:"PATCH",body:JSON.stringify({enabled:!wasOn})}); await loadLlm(); }
    catch(err){ showErr(err); piiTog.textContent=wasOn?'on':'off'; }
  };
  main.querySelectorAll(".pii-cat").forEach(cb=>{
    cb.onchange=async function(){
      const cat=this.getAttribute("data-cat");
      const on=this.checked;
      this.disabled=true;
      try{ await api("/superadmin/pii-config",{method:"PATCH",body:JSON.stringify({categories:{[cat]:on}})}); await loadLlm(); }
      catch(err){ showErr(err); this.checked=!on; this.disabled=false; }
    };
  });
  // ── Embedding config ── v1/v2 backend selectors + v2 active toggle
  const embV1=main.querySelector(".emb-v1");
  if(embV1) embV1.onchange=async()=>{
    const v=embV1.value;
    embV1.disabled=true;
    try{ await api("/superadmin/embedding-config",{method:"PATCH",body:JSON.stringify({v1_backend:v||null})}); await loadLlm(); }
    catch(err){ showErr(err); embV1.disabled=false; }
  };
  const embV2=main.querySelector(".emb-v2");
  if(embV2) embV2.onchange=async()=>{
    const v=embV2.value;
    embV2.disabled=true;
    try{ await api("/superadmin/embedding-config",{method:"PATCH",body:JSON.stringify({v2_backend:v||null})}); await loadLlm(); }
    catch(err){ showErr(err); embV2.disabled=false; }
  };
  const embV2Active=main.querySelector(".emb-v2-active");
  if(embV2Active) embV2Active.onchange=async function(){
    this.disabled=true;
    try{ await api("/superadmin/embedding-config",{method:"PATCH",body:JSON.stringify({v2_active:this.checked})}); await loadLlm(); }
    catch(err){ showErr(err); this.checked=!this.checked; this.disabled=false; }
  };
  // ── Feature toggles ── bool checkboxes + numeric inputs
  main.querySelectorAll(".ft-tog").forEach(cb=>{
    cb.onchange=async function(){
      const name=this.getAttribute("data-name");
      const on=this.checked;
      this.disabled=true;
      try{ await api("/superadmin/feature-flags",{method:"PATCH",body:JSON.stringify({updates:{[name]:on}})}); await loadLlm(); }
      catch(err){ showErr(err); this.checked=!on; this.disabled=false; }
    };
  });
  main.querySelectorAll(".ft-num").forEach(inp=>{
    let timer;
    inp.addEventListener("input",function(){
      clearTimeout(timer);
      timer=setTimeout(async()=>{
        const name=this.getAttribute("data-name");
        const val=parseInt(this.value,10);
        if(isNaN(val)) return;
        this.disabled=true;
        try{ await api("/superadmin/feature-flags",{method:"PATCH",body:JSON.stringify({updates:{[name]:val}})}); }
        catch(err){ showErr(err); }
        this.disabled=false;
      },600);
    });
  });
  main.querySelectorAll(".ft-str").forEach(inp=>{
    let timer;
    inp.addEventListener("input",function(){
      clearTimeout(timer);
      timer=setTimeout(async()=>{
        const name=this.getAttribute("data-name");
        const val=this.value.trim();
        this.disabled=true;
        try{ await api("/superadmin/feature-flags",{method:"PATCH",body:JSON.stringify({updates:{[name]:val}})}); }
        catch(err){ showErr(err); }
        this.disabled=false;
      },600);
    });
  });
}

    <td class="right mono">${u.docsReprocessed||0}</td>

      <div class="panel" style="flex:1;min-width:128px"><div class="muted" style="font-size:10px;text-transform:uppercase;letter-spacing:.06em">Users</div><div style="font-size:22px;font-weight:700">${s.totalUsers}</div></div>
      <div class="panel" style="flex:1;min-width:128px"><div class="muted" style="font-size:10px;text-transform:uppercase;letter-spacing:.06em">Documents</div><div style="font-size:22px;font-weight:700">${s.totalDocs}</div></div>
      <div class="panel" style="flex:1;min-width:128px"><div class="muted" style="font-size:10px;text-transform:uppercase;letter-spacing:.06em">Tokens</div><div style="font-size:22px;font-weight:700">${_tok(s.totalTokens)}</div></div>
      <div class="panel" style="flex:1;min-width:128px"><div class="muted" style="font-size:10px;text-transform:uppercase;letter-spacing:.06em">Cost</div><div style="font-size:22px;font-weight:700">${_money(s.totalCost)}</div></div>

async function loadOverview(){ STATE.overview=await api("/superadmin/overview"); paintOverview(); }

function paintOverview(){
  const o=STATE.overview||{}; const k=o.kpis||{}; const h=o.health||{};
  const dot=(s)=>{ const c = s==='ok'?'var(--emerald)': (s==='down'||s==='unconfigured')?'var(--rose)':'var(--gold2)'; return `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c};margin-right:7px"></span>`; };
  const kpi=(n,l)=>`<div class="kpi"><div class="n mono">${n==null?'—':n}</div><div class="l">${l}</div></div>`;
  const byPlan=Object.entries(k.usersByPlan||{}).map(([p,n])=>`<span class="tag" style="color:var(--gold2)">${esc(p)}: ${n}</span>`).join(' ')||'—';
  const hrow=(label,val)=>`<div class="hrow">${dot(val)}<span class="hk">${label}</span><span class="hv mono">${esc(val||'?')}</span></div>`;
  const prov=h.llmProviders||{};
  const provRows=Object.entries(prov).map(([name,on])=>`<div class="hrow">${dot(on?'ok':'unconfigured')}<span class="hk">LLM · ${esc(name)}</span><span class="hv mono">${on?'key set':'no key'}</span></div>`).join('');
  const main=$('<main></main>');
  main.innerHTML=`
    <div class="kpis" style="grid-template-columns:repeat(4,1fr)">
      ${kpi(k.users,'users')}${kpi(k.documents,'documents')}${kpi(k.documentsThisMonth,'docs this month')}${kpi(k.aiMessagesThisMonth,'AI msgs / mo')}
    </div>
    <div class="kpis" style="grid-template-columns:repeat(4,1fr);margin-top:12px">
      ${kpi(k.documentsReady,'ready')}${kpi(k.documentsFailed,'failed')}${kpi(k.feedbackOpen,'open feedback')}${kpi(o.environment,'environment')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px">
      <div class="panel"><div class="ph">System health</div>
        ${hrow('Database',h.db)}${hrow('Redis',h.redis)}${hrow('Worker',h.worker)}${hrow('Object storage',h.storage)}${hrow('LLM',h.llm)}
      </div>
      <div class="panel"><div class="ph">LLM providers</div>${provRows||'<div class="muted">none</div>'}</div>
    </div>
    <div style="margin-top:16px"><div class="ph">Users by plan</div><div style="margin-top:8px">${byPlan}</div></div>
    <div class="muted mono" style="margin-top:18px;font-size:11px">v${esc(o.version||'')} · tenant ${esc(o.tenant||'')} · ${esc((o.timestamp||'').slice(0,19))} · <button class="btn ghost sm refresh" style="font-size:11px;padding:3px 10px">↻ Refresh</button></div>`;
  app.querySelector("main")?.remove();
  app.appendChild(main);
  main.querySelector(".refresh").onclick=(e)=>{e.preventDefault();loadOverview().then(()=>showOk("Overview refreshed")).catch(showErr);};
}

async function loadPlans(){
  const d=await api("/superadmin/plans");
  STATE.plans=d.plans||[];
  paintPlans();
}

function paintPlans(){
  const num=(v)=> v==null ? '∞' : v;
  const tog=(on)=> on ? 'on' : 'off';
  const body=STATE.plans.map(p=>`
    <tr data-plan="${p.plan}">
      <td style="font-weight:600;text-transform:capitalize">${esc(p.plan)}</td>
      <td><button class="btn ${p.enabled?'':'ghost'} sm t-enabled">${tog(p.enabled)}</button></td>
      <td><input class="q q-docs" type="number" min="0" placeholder="∞" value="${p.docsMonthly==null?'':p.docsMonthly}" style="width:70px"> /mo</td>
      <td><input class="q q-ai" type="number" min="0" placeholder="∞" value="${p.aiMonthly==null?'':p.aiMonthly}" style="width:70px"> /mo</td>
      <td><button class="btn ${p.llmEnabled?'':'ghost'} sm t-llm">${tog(p.llmEnabled)}</button></td>
      <td><button class="btn ${p.paidModels?'':'ghost'} sm t-paid">${tog(p.paidModels)}</button></td>
      <td><button class="btn ${p.dedicatedContainer?'':'ghost'} sm t-ded">${tog(p.dedicatedContainer)}</button></td>
      <td><button class="btn sm save">Save</button></td>
    </tr>`).join("");
  const main=$('<main></main>');
  main.innerHTML=`
    <div class="muted" style="margin-bottom:12px;font-size:13px">Configure each tier — toggle on/off, set the monthly document &amp; AI-message quotas (blank = unlimited), enable/disable LLM &amp; paid models, and the Enterprise dedicated-container option. Changes apply immediately and are enforced on every upload &amp; chat.</div>
    <div class="err" id="cerr"></div>
    <div class="wrap"><table>
      <thead><tr><th>Plan</th><th>Enabled</th><th>Docs</th><th>AI msgs</th><th>LLM</th><th>Paid models</th><th>Dedicated container</th><th></th></tr></thead>
      <tbody>${body}</tbody>
    </table></div>`;
  app.querySelector("main")?.remove();
  app.appendChild(main);
  main.querySelectorAll("tr[data-plan]").forEach(tr=>{
    tr.querySelectorAll(".btn[class*='t-']").forEach(b=>{
      b.onclick=()=>{ const on=b.textContent==='on'; b.textContent=on?'off':'on'; b.classList.toggle('ghost',on); };
    });
    tr.querySelector(".save").onclick=async()=>{
      const plan=tr.getAttribute("data-plan");
      const docs=tr.querySelector(".q-docs").value, ai=tr.querySelector(".q-ai").value;
      const body={
        enabled: tr.querySelector(".t-enabled").textContent==='on',
        llmEnabled: tr.querySelector(".t-llm").textContent==='on',
        paidModels: tr.querySelector(".t-paid").textContent==='on',
        dedicatedContainer: tr.querySelector(".t-ded").textContent==='on',
      };
      if(docs==='') body.unlimitedDocs=true; else body.docsMonthly=parseInt(docs,10);
      if(ai==='') body.unlimitedAi=true; else body.aiMonthly=parseInt(ai,10);
      tr.style.opacity=.5;
      try{ await api(`/superadmin/plans/${plan}`,{method:"PATCH",body:JSON.stringify(body)}); await loadPlans(); }
      catch(err){ showErr(err); tr.style.opacity=1; }
    };
  });
}

async function loadFeedback(){
  const d=await api("/superadmin/feedback");
  STATE.feedback=d.feedback||[]; STATE.fcounts=d.counts||{};
  updateFbBadge(STATE.fcounts.new||0);
  paintFeedback();
}

function paintFeedback(){
  const c=STATE.fcounts;
  const kpi=(k,lbl)=>`<div class="kpi"><div class="n mono">${c[k]??0}</div><div class="l">${lbl}</div></div>`;
  const stars=(r)=> r? "★".repeat(r)+"☆".repeat(5-r) : "—";
  const STAT={new:"var(--gold2)",in_progress:"var(--gold)",reviewed:"var(--ink2)",resolved:"var(--emerald)",verified:"#46d29a"};
  const body=STATE.feedback.map(f=>`
    <tr data-id="${f.id}">
      <td><div style="font-weight:600">${f.ref?`<span class="mono" style="color:var(--gold2);font-size:11px">${esc(f.ref)}</span> `:''}${esc(f.category)}${f.hasIssues?' <span class="tag" style="color:var(--rose)">issue</span>':''}${f.status==='verified'?' <span class="tag" style="color:#46d29a">✓ verified</span>':''}${f.followupNeeded?' <span class="tag" style="color:var(--rose)">↻ follow-up</span>':''}</div>
        <div class="muted" style="font-size:11px">${esc(f.email||'')} · ${esc((f.createdAt||'').slice(0,10))}${f.page?' · '+esc(f.page):''}${f.verifiedBy?' · verified by '+esc(f.verifiedBy.split('@')[0]):''}</div></td>
      <td class="mono" style="color:var(--gold2)">${stars(f.rating)}</td>
      <td>${f.comments?esc(f.comments):''}${f.suggestion?'<div class="muted" style="font-size:11px">💡 '+esc(f.suggestion)+'</div>':''}${(f.screenshots&&f.screenshots.length)?'<div style="display:flex;gap:4px;margin-top:6px">'+f.screenshots.map(s=>'<a href="'+s+'" target="_blank"><img src="'+s+'" style="width:40px;height:40px;object-fit:cover;border-radius:4px;border:1px solid var(--line)"></a>').join('')+'</div>':''}${f.resolution?'<div style="font-size:11px;margin-top:6px;color:var(--gold2);border-left:2px solid var(--gold);padding-left:6px">'+esc(f.resolution)+'</div>':''}${f.followupNote?'<div style="font-size:11px;margin-top:6px;color:var(--rose);border-left:2px solid var(--rose);padding-left:6px">↻ Follow-up: '+esc(f.followupNote)+'</div>':''}</td>
      <td><span class="tag" style="color:${STAT[f.status]||'var(--ink3)'}">${esc((f.status||'').replace('_',' '))}</span></td>
      <td class="right"><select class="setstatus">${["new","in_progress","reviewed","resolved","verified"].map(s=>`<option value="${s}"${s===f.status?' selected':''}>${s.replace('_',' ')}</option>`).join("")}</select>
        <div style="display:flex;gap:4px;margin-top:6px;justify-content:flex-end">
          <button class="btn sm accept" title="Accept as resolved (marks verified)">✓ Accept</button>
          <button class="btn ghost sm followup" title="Needs follow-up — add a note, re-opens the item">↻ Follow-up</button>
        </div></td>
    </tr>`).join("");
  const main=$('<main></main>');
  main.innerHTML=`
    <div class="kpis">${kpi("total","total")}${kpi("new","new")}${kpi("inProgress","in progress")}${kpi("issues","open issues")}${kpi("resolved","resolved")}${kpi("verified","verified")}<div class="kpi"><div class="n mono" style="color:var(--gold2)">${c.currentVersion||'1.1.0'}</div><div class="l">version</div></div></div>
    <div class="toolbar"><button class="btn ghost sm refresh">Refresh</button></div>
    <div class="err" id="cerr"></div>
    <div class="wrap"><table>
      <thead><tr><th>Category</th><th>Rating</th><th>Feedback</th><th>Status</th><th class="right">Set status</th></tr></thead>
      <tbody>${body||'<tr><td colspan="5" class="muted" style="text-align:center;padding:20px">No feedback yet.</td></tr>'}</tbody>
    </table></div>`;
  app.querySelector("main")?.remove();
  app.appendChild(main);
  main.querySelector(".refresh").onclick=()=>loadFeedback().catch(showErr);
  main.querySelectorAll("tr[data-id]").forEach(tr=>{
    const id=tr.getAttribute("data-id");
    const _sel=tr.querySelector(".setstatus");
    // Remember the value before a change so a cancelled "verified" can revert the
    // dropdown SYNCHRONOUSLY instead of flashing "Verified" until an async reload (feedback #45).
    _sel.addEventListener("focus",()=>{ _sel.dataset.prev=_sel.value; });
    _sel.onchange=async(e)=>{
      if(e.target.value==="verified" && !confirm("Mark verified? This permanently deletes the screenshots (the feedback row is kept).")){ e.target.value=e.target.dataset.prev||e.target.value; return; }
      tr.style.opacity=.5;
      try{ await api(`/superadmin/feedback/${id}`,{method:"PATCH",body:JSON.stringify({status:e.target.value})}); await loadFeedback(); }
      catch(err){ showErr(err); tr.style.opacity=1; }
    };
    // Human review · accept-as-resolved (→ verified) vs follow-up-needed (+note, re-opens).
    tr.querySelector(".accept").onclick=async()=>{
      if(!confirm("Accept as resolved? Marks it verified and permanently deletes the screenshots (the row is kept).")) return;
      tr.style.opacity=.5;
      try{ await api(`/superadmin/feedback/${id}`,{method:"PATCH",body:JSON.stringify({status:"verified"})}); await loadFeedback(); }
      catch(err){ showErr(err); tr.style.opacity=1; }
    };
    tr.querySelector(".followup").onclick=async()=>{
      const note=prompt("What follow-up is needed? (re-opens the item as In progress)");
      if(note===null) return;
      tr.style.opacity=.5;
      try{ await api(`/superadmin/feedback/${id}`,{method:"PATCH",body:JSON.stringify({status:"in_progress",followupNeeded:true,followupNote:note})}); await loadFeedback(); }
      catch(err){ showErr(err); tr.style.opacity=1; }
    };
  });
}

async function boot(){
  let me;
  try{ me=await api("/me"); }
  catch(e){ renderLogin(e.code===401?"":""); return; }
  if(!me.isSuperadmin){ renderDenied(me); return; }
  shell(me);
  setView(STATE.view);
}
boot();
</script>
</body>
</html>
