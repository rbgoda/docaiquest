worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Patch the bundled mime.types — nginx-alpine 1.27 doesn't ship a
    # mapping for `.mjs`, so it falls back to application/octet-stream.
    # Browsers strict-check JS-module MIME on `import("...mjs")` calls
    # and refuse to execute octet-stream, which is what was breaking
    # PDF.js worker loading in the chat panel. Adding the explicit
    # mapping fixes it without touching the upstream mime file.
    types {
        application/javascript  mjs;
    }

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    gzip              on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Backend service is resolved via Docker DNS (compose service name).
    # In Helm/k8s this will become a Service name and the upstream block stays.
    upstream docaiq_backend {
        server backend:8001;
    }

    # ────────────────────────────────────────────────────────────────────
    # Security headers (TODO #17)
    # ────────────────────────────────────────────────────────────────────
    # `always` so they're attached to error responses too. CSP is wide
    # enough for the React SPA + inline styles Vite emits, plus the
    # blob: URLs PDF.js uses for its worker. Tighten further (drop
    # `'unsafe-inline'`, move to nonce-based CSP) once we audit every
    # inline style/script in the bundle.
    # index.html (and the static .html pages) must NOT be heuristically cached by
    # the browser, or a stale index keeps pointing at an old hashed JS bundle after
    # a deploy — users then see the previous app until a hard navigation (this was the
    # "opens in desktop mode until I sign out/in" bug). Hashed /assets/ stay immutable.
    map $sent_http_content_type $cache_policy {
        default      "";
        ~*text/html  "no-cache";
    }

    map $sent_http_content_type $csp_policy {
        # frame-ancestors: docaiq may be embedded as an app-tab by the AIQ Suite
        # (chataiq + any *.jicama.tech app). Same registrable domain → SameSite=Lax
        # session/SSO cookies still flow into the iframe, so the embed is authed.
        default "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob:; frame-ancestors 'self' https://chataiq.jicama.tech https://*.jicama.tech; base-uri 'self'; form-action 'self';";
    }

    server {
        listen      80 default_server;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        # Allow PDF uploads up to the backend's configured cap (100 MB).
        client_max_body_size 100m;

        # Security headers. `always` so they're sent on error responses too.
        # HSTS is conservative — 1 year, include subdomains, no preload (the
        # operator must explicitly opt into preload after verifying the cert
        # chain on every subdomain in scope).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # NOTE: no X-Frame-Options. It only offers DENY / SAMEORIGIN — neither can
        # allow-list chataiq's cross-subdomain frame. Framing is controlled solely by
        # CSP `frame-ancestors` above (modern browsers honour it over XFO), scoped to
        # the AIQ Suite. Adding XFO:DENY here would override CSP and block the embed.
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy   $csp_policy always;
        add_header Cache-Control             $cache_policy always;   # no-cache for text/html only (empty ⇒ header skipped)
        # COOP stays same-origin (it governs the browsing-context group / window.opener,
        # not framing — the suite iframe embed is gated by frame-ancestors, not COOP).
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # Reverse-proxy the API. Backend exposes /api/* directly.
        # Generous read timeout so streaming endpoints (M9 SSE) don't get cut.
        location /api/ {
            proxy_pass         http://docaiq_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_read_timeout 300s;
        }

        # Dev: serve admin console from the backend (prod serves it via host nginx)
        location /admin {
            proxy_pass         http://docaiq_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
        }

        # Vite hashes asset filenames, so cache them aggressively.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA fallback — every non-asset, non-API path returns index.html
        # so client-side routing works on deep links / refresh. `$uri.html` is
        # tried first so static legal pages resolve at clean routes
        # (/privacy → privacy.html, /termsofservice → termsofservice.html).
        location / {
            try_files $uri $uri.html $uri/ /index.html;
        }
    }
}
