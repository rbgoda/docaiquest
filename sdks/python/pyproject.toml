[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docaiquest"
version = "1.0.7"
description = "Official Python SDK for the DocAIQuest document-intelligence API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DocAIQuest" }]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/rbgoda/docaiquest"

[tool.setuptools.packages.find]
include = ["docaiquest*"]
